<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayLoad · Administración</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Herramienta interna: invitar testers y otorgar licencias.
  Requiere sesión iniciada con una cuenta que tenga is_admin = 1.
-->
<script>
  /* Tema antes de pintar: evita el fogonazo blanco al cargar en oscuro. */
  (function(){
    var t = 'sistema';
    try { t = localStorage.getItem('pl-theme') || 'sistema'; } catch(e){}
    if(t !== 'sistema') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
:root{
  --color-bg:#13151f; --color-surface:#20222f; --color-text:#f1f1f5;
  --color-accent:#9184d9; --line:#414553;
  --color-neutral-200:#e4e7f5; --color-neutral-800:#3f424d;
  --color-accent-100:#f5f4ff; --color-accent-300:#d2cefd; --color-accent-800:#423a6a;
  --color-ok:#a9df90; --color-ok-bg:#2e3d2b;
  --color-warn:#e0ab8d; --color-warn-bg:#3d3129;
  --color-risk:#e08d96; --color-risk-bg:#3d2c2f;
  --font-heading:"Inter",system-ui,sans-serif;
  --radius-md:8px; --radius-lg:14px;
  --muted:color-mix(in srgb,var(--color-text) 74%,transparent);
  --muted-2:color-mix(in srgb,var(--color-text) 56%,transparent);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--color-bg);color:var(--color-text);font-family:"Inter",system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--font-heading);font-weight:500;letter-spacing:-.022em;margin:0}
h1{font-size:27px} h2{font-size:18px}
p{margin:0}
a{color:var(--color-accent-300);text-decoration:none}
button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}
input,select,textarea{font:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
svg{display:block}

.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2)}
.num{font-family:var(--font-heading);font-weight:500;letter-spacing:-.015em}
.mark{width:25px;height:25px;border-radius:4px;border:1px solid var(--color-accent);display:inline-flex;
  align-items:center;justify-content:center;font-size:11px;color:var(--color-accent);flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--font-heading);
  font-weight:500;font-size:14px;line-height:1.2;border:1px solid transparent;padding:9px 14px;
  border-radius:var(--radius-md);transition:background .14s ease,border-color .14s ease,color .14s ease}
.btn-primary{color:var(--color-accent-300);border-color:var(--color-accent)}
.btn-primary:hover{background:color-mix(in srgb,var(--color-accent) 18%,transparent)}
.btn-secondary{border-color:var(--line);color:var(--muted)}
.btn-secondary:hover{background:color-mix(in srgb,var(--color-text) 8%,transparent);color:var(--color-text)}
.btn-sm{font-size:13px;padding:5px 10px}
.btn-danger{color:var(--color-risk);border-color:color-mix(in srgb,var(--color-risk) 55%,transparent)}
.btn-danger:hover{background:color-mix(in srgb,var(--color-risk) 15%,transparent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.input{width:100%;min-height:40px;padding:9px 11px;font-size:14px;color:var(--color-text);
  background:var(--input-bg);border:1px solid var(--line);border-radius:var(--radius-md);
  caret-color:var(--color-accent)}
.input::placeholder{color:var(--muted-2)}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0}
textarea.input{min-height:92px;resize:vertical;line-height:1.5}
select.input{appearance:none;padding-right:28px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px;background-repeat:no-repeat}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:13px;color:var(--muted)}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px;border-radius:6px;
  white-space:nowrap}
.tag-ok{background:var(--color-ok-bg);color:var(--color-ok)}
.tag-warn{background:var(--color-warn-bg);color:var(--color-warn)}
.tag-risk{background:var(--color-risk-bg);color:var(--color-risk)}
.tag-neutral{background:var(--color-neutral-800);color:var(--color-neutral-200)}
.tag-accent{background:var(--color-accent-800);color:var(--color-accent-100)}

/* — estructura — */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 30px;
  background:color-mix(in srgb,var(--color-bg) 92%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-heading);font-weight:500;
  font-size:17px;color:var(--color-text)}
.wrap{max-width:1180px;margin:0 auto;padding:30px 30px 64px;display:flex;flex-direction:column;gap:26px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);
  border-radius:var(--radius-lg);background:var(--color-surface);overflow:hidden}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font-family:var(--font-heading);font-weight:500;font-size:27px;letter-spacing:-.028em;line-height:1}

.panel{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--color-surface);
  overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head p{font-size:13px;color:var(--muted-2);margin-top:3px}
.panel-body{padding:18px}

.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);
  padding:10px 12px;font-weight:400}
.table td{padding:10px 12px}
.table th:first-child,.table td:first-child{padding-left:18px}
.table th:last-child,.table td:last-child{padding-right:18px;text-align:right}
.table thead tr{border-bottom:1px solid var(--line)}
.table tbody tr+tr{border-top:1px solid color-mix(in srgb,var(--color-text) 11%,transparent)}
.table tbody tr:hover{background:color-mix(in srgb,var(--color-text) 6%,transparent)}
.mail{font-size:14px}
.sub{font-size:12.5px;color:var(--muted-2);margin-top:2px}
.empty{padding:28px 18px;text-align:center;color:var(--muted-2);font-size:14px}

.grid-invite{display:grid;grid-template-columns:minmax(0,1fr) 220px 180px;gap:14px;align-items:end}
.rowsel{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.rowsel select,.rowsel input{min-height:34px;padding:5px 9px;font-size:13.5px}
.rowsel select{width:130px} .rowsel input{width:130px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
  padding:11px 18px;border-radius:var(--radius-md);font-size:14px;
  background:var(--color-surface);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .18s ease}
.toast.show{opacity:1}
.toast.bad{border-color:color-mix(in srgb,var(--color-risk) 60%,transparent);color:var(--color-risk)}
.toast.good{border-color:color-mix(in srgb,var(--color-ok) 60%,transparent);color:var(--color-ok)}

.gate{max-width:420px;margin:14vh auto;text-align:center;display:flex;flex-direction:column;
  align-items:center;gap:16px;padding:0 20px}

/* — interruptor — */
.sw{width:42px;height:24px;border-radius:20px;background:var(--color-neutral-800);position:relative;
  flex:none;transition:background .18s ease}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:var(--muted);transition:transform .18s ease,background .18s ease}
.sw.on{background:color-mix(in srgb,var(--color-accent) 62%,transparent)}
.sw.on::after{transform:translateX(18px);background:var(--color-accent-100)}
.swrow{display:flex;align-items:flex-start;gap:14px;padding:14px 0}
.swrow+.swrow{border-top:1px solid color-mix(in srgb,var(--color-text) 11%,transparent)}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3),.stat:nth-child(4){border-top:1px solid var(--line)}
  .stat:nth-child(3){border-left:0}
  .grid-invite{grid-template-columns:minmax(0,1fr)}
  .wrap,.top{padding-left:18px;padding-right:18px}
  .panel{overflow-x:auto}
}

/* ═══════════ TEMA CLARO ═══════════
   Los colores que estaban escritos a mano pasan a variables; solo así
   se puede cambiar de tema sin tocar cada regla. */
:root{ --input-bg:#191b26; --rail-bg:#0f111a; --sombra:0 20px 50px rgba(0,0,0,.55); }

:root[data-theme="claro"]{
  --color-bg:#f1f2f7; --color-surface:#ffffff; --color-text:#161822;
  --line:#d8dae4; --color-divider:color-mix(in srgb,#161822 18%,transparent);
  --input-bg:#f7f8fc; --rail-bg:#ffffff;
  --color-accent:#6d5fc6; --color-accent-100:#2c2554; --color-accent-200:#3a3170;
  --color-accent-300:#584ab4; --color-accent-400:#4b3ea6; --color-accent-800:#e8e5fb;
  --color-neutral-100:#1d1f2a; --color-neutral-200:#3f4250; --color-neutral-300:#5a5d6c;
  --color-neutral-600:#8b8f9e; --color-neutral-700:#c9ccd8; --color-neutral-800:#e4e6ef;
  --color-ok:#3d8a4f;   --color-ok-bg:#e4f2e6;
  --color-warn:#9c6329; --color-warn-bg:#f8eddf;
  --color-risk:#b04450; --color-risk-bg:#fae4e6;
  --sombra:0 16px 40px rgba(22,24,34,.14);
  --shadow-sm:0 0 0 1px #d8dae4;
  --shadow-md:0 0 0 1px #c9ccd8,0 6px 18px rgba(22,24,34,.10);
  --muted:color-mix(in srgb,var(--color-text) 70%,transparent);
  --muted-2:color-mix(in srgb,var(--color-text) 52%,transparent);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="oscuro"]):not([data-theme="claro"]){
    --color-bg:#f1f2f7; --color-surface:#ffffff; --color-text:#161822;
    --line:#d8dae4; --color-divider:color-mix(in srgb,#161822 18%,transparent);
    --input-bg:#f7f8fc; --rail-bg:#ffffff;
    --color-accent:#6d5fc6; --color-accent-100:#2c2554; --color-accent-200:#3a3170;
    --color-accent-300:#584ab4; --color-accent-400:#4b3ea6; --color-accent-800:#e8e5fb;
    --color-neutral-100:#1d1f2a; --color-neutral-200:#3f4250; --color-neutral-300:#5a5d6c;
    --color-neutral-600:#8b8f9e; --color-neutral-700:#c9ccd8; --color-neutral-800:#e4e6ef;
    --color-ok:#3d8a4f;   --color-ok-bg:#e4f2e6;
    --color-warn:#9c6329; --color-warn-bg:#f8eddf;
    --color-risk:#b04450; --color-risk-bg:#fae4e6;
    --sombra:0 16px 40px rgba(22,24,34,.14);
    --shadow-sm:0 0 0 1px #d8dae4;
    --shadow-md:0 0 0 1px #c9ccd8,0 6px 18px rgba(22,24,34,.10);
    --muted:color-mix(in srgb,var(--color-text) 70%,transparent);
    --muted-2:color-mix(in srgb,var(--color-text) 52%,transparent);
  }
}
body{transition:background .18s ease,color .18s ease}

/* ═══════════ MENÚ DE LA CUENTA ═══════════ */
.me{cursor:pointer}
.umenu{position:fixed;z-index:80;width:250px;padding:8px;border-radius:12px;
  background:var(--color-surface);border:1px solid var(--line);box-shadow:var(--sombra);
  display:flex;flex-direction:column;gap:2px;
  font-family:"Inter",system-ui,sans-serif;color:var(--color-text)}
.umenu[hidden]{display:none}
.umenu-yo{padding:9px 10px 10px}
.umenu-n{font-size:14px;line-height:1.25}
.umenu-s{font-size:12px;color:var(--muted-2);margin-top:2px}
.umenu-it{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;
  border-radius:8px;font-size:13.5px;color:var(--muted);text-align:left;
  text-decoration:none;background:transparent;border:0;cursor:pointer}
.umenu-it svg{width:15px;height:15px;flex:none;opacity:.85}
.umenu-it:hover{background:color-mix(in srgb,var(--color-text) 8%,transparent);color:var(--color-text)}
.umenu-salir{color:var(--color-risk)}
.umenu-salir:hover{background:color-mix(in srgb,var(--color-risk) 14%,transparent);color:var(--color-risk)}
.umenu-sep{height:1px;background:var(--line);margin:6px 4px}
.umenu-tit{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted-2);padding:6px 10px 4px}
.umenu-ops{display:flex;gap:5px;padding:0 6px 4px}
.umenu-op{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:7px 6px;border-radius:7px;border:1px solid var(--line);background:transparent;
  font-size:11.5px;color:var(--muted);cursor:pointer}
.umenu-op svg{width:14px;height:14px}
.umenu-op:hover{color:var(--color-text);border-color:var(--color-accent)}
.umenu-op[aria-pressed="true"]{color:var(--color-accent-300);border-color:var(--color-accent);
  background:color-mix(in srgb,var(--color-accent) 12%,transparent)}
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const API = 'api/';
let D = null;   /* estado del servidor */

async function call(data){
  const opt = data
    ? {method:'POST', headers:{'Content-Type':'application/json'},
       credentials:'same-origin', body:JSON.stringify(data)}
    : {credentials:'same-origin'};
  const url = API + 'admin.php' + (data ? '' : '?action=estado');
  const r = await fetch(url, opt);
  let body = null;
  try { body = await r.json(); } catch(e){}

  /* El `ok` de fetch dice que la respuesta llegó, no que la diera el API:
     si PHP no llega a ejecutarse, o el hosting mete su propia página de
     error, lo que baja es un 200 con algo que no es JSON. Solo vale como
     buena una respuesta que traiga su propio `ok`. */
  return (body && typeof body.ok !== 'undefined')
    ? {status:r.status, ...body}
    : {status:r.status, ok:false, error:'El servidor no ha contestado como se esperaba.'};
}

function toast(msg, kind){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind || '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { t.className = 'toast ' + (kind || ''); }, 3200);
}

const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const fecha = s => s ? new Date(s.replace(' ','T')).toLocaleDateString('es-ES',
  {day:'2-digit', month:'short', year:'2-digit'}) : '—';

const PLAN_TAG = {
  'tester':'tag-accent', 'rookie':'tag-neutral', 'amateur':'tag-neutral', 'pro':'tag-ok',
  'club-amateur':'tag-neutral', 'club-pro':'tag-ok', 'suspendido':'tag-risk'
};

/* ── pantalla de acceso denegado ─────────────────────────────────── */
function gate(msg, link){
  document.getElementById('app').innerHTML = `
    <div class="gate">
      <span class="mark">PL</span>
      <h1>Administración</h1>
      <p style="color:var(--muted)">${esc(msg)}</p>
      ${link ? `<a class="btn btn-primary" href="acceso.html">Iniciar sesión</a>` : ''}
      <p style="font-size:13px;color:var(--muted-2)">
        Para convertir una cuenta en administradora:<br>
        <code style="font-size:12.5px">UPDATE users SET is_admin = 1 WHERE email = '…';</code>
      </p>
    </div>`;
}

/* fila con interruptor: título, explicación y el estado actual */
function sw(clave, on, titulo, explica){
  return `<div class="swrow">
    <button class="sw ${on?'on':''}" data-ajuste="${clave}" role="switch" aria-checked="${on}"
            aria-label="${titulo}"></button>
    <div>
      <div style="font-size:14.5px">${titulo}</div>
      <div class="sub" style="margin-top:3px">${explica}</div>
    </div>
    <span class="tag ${on?'tag-ok':'tag-warn'}" style="margin-left:auto">${on?'Activado':'Desactivado'}</span>
  </div>`;
}

/* ── pantalla principal ──────────────────────────────────────────── */
function render(){
  const r = D.resumen;
  document.getElementById('app').innerHTML = `
    <header class="top">
      <a class="brand" href="PlayLoad-dashboard.html"><span class="mark">PL</span>PlayLoad</a>
      <span class="tag tag-warn">Pruebas cerradas</span>
      <span style="margin-left:auto;font-size:13.5px;color:var(--muted-2)">
        ${esc(D.admin.email)}
      </span>
      <button class="btn btn-secondary btn-sm" data-logout>Salir</button>
    </header>

    <div class="wrap">
      <div>
        <h1>Testers y licencias</h1>
        <p style="color:var(--muted);margin-top:8px;max-width:70ch">
          Mientras el alta esté cerrada, solo pueden crear cuenta los correos de esta lista.
          Quien ya tiene cuenta sigue entrando con normalidad.
        </p>
      </div>

      <section class="stats">
        <div class="stat"><span class="eyebrow">Invitados</span><b class="num">${r.invitados}</b></div>
        <div class="stat"><span class="eyebrow">Sin registrar</span>
          <b class="num" style="${r.pendientes ? 'color:var(--color-warn)' : ''}">${r.pendientes}</b></div>
        <div class="stat"><span class="eyebrow">Cuentas creadas</span><b class="num">${r.cuentas}</b></div>
        <div class="stat"><span class="eyebrow">Activas</span>
          <b class="num" style="color:var(--color-ok)">${r.activas}</b></div>
      </section>

      <!-- ── interruptores ── -->
      <section class="panel">
        <div class="panel-head">
          <div><h2>Registro y precios</h2>
            <p>Lo que ve cualquiera que entre en la web pública.</p></div>
        </div>
        <div class="panel-body" style="display:flex;flex-direction:column;gap:2px">
          ${sw('registro_abierto', D.ajustes.registro_abierto,
               'Registro abierto a cualquiera',
               D.ajustes.registro_abierto
                 ? 'Cualquiera puede crear cuenta desde registro.html.'
                 : 'Solo pueden crear cuenta los correos de la lista de abajo.')}
          ${sw('precios_publicos', D.ajustes.precios_publicos,
               'Mostrar los precios en la web',
               D.ajustes.precios_publicos
                 ? 'Las tarifas de abajo se ven en precios.html.'
                 : 'La página de precios dice «Por determinar» y no envía los importes al navegador.')}
        </div>
      </section>

      <!-- ── tarifas ── -->
      <section class="panel">
        <div class="panel-head">
          <div><h2>Tarifas</h2>
            <p>Deja un importe vacío para que ese plan siga en «Por determinar».
               Desactivar un plan lo retira de la web y de las invitaciones nuevas.</p></div>
        </div>
        <table class="table">
          <thead><tr><th>Plan</th><th>Límites</th>
            <th style="text-align:right">€ / mes</th><th style="text-align:right">€ / año</th>
            <th style="text-align:center">Se ofrece</th><th></th></tr></thead>
          <tbody>${D.tarifas.map(t => `
            <tr data-plan-id="${t.id}">
              <td>
                <div class="mail">${esc(t.name)} ${t.best ? '<span class="tag tag-accent" style="margin-left:4px">destacado</span>' : ''}</div>
                <div class="sub">${t.track === 'club' ? 'Club' : 'Profesional'} · ${esc(t.id)}</div>
              </td>
              <td style="color:var(--muted)">
                ${t.teams === '∞' ? 'Equipos ilimitados'
                                  : t.teams + (t.teams === '1' ? ' equipo' : ' equipos')} ·
                ${t.players === '∞' ? 'jugadores ilimitados' : t.players + ' jugadores'}
                <div class="sub">${esc(t.staff)}</div>
              </td>
              <td style="text-align:right">
                <input class="input" data-m inputmode="decimal" placeholder="—"
                       style="width:96px;text-align:right;min-height:34px"
                       value="${t.price_m ?? ''}"></td>
              <td style="text-align:right">
                <input class="input" data-y inputmode="decimal" placeholder="—"
                       style="width:96px;text-align:right;min-height:34px"
                       value="${t.price_y ?? ''}"></td>
              <td style="text-align:center">
                <button class="sw ${+t.active ? 'on' : ''}" data-activo
                        role="switch" aria-checked="${!!+t.active}"
                        aria-label="Se ofrece"></button></td>
              <td><button class="btn btn-secondary btn-sm" data-tarifa>Guardar</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </section>

      <!-- ── invitar ── -->
      <section class="panel">
        <div class="panel-head">
          <div><h2>Invitar testers</h2>
            <p>Pega uno o varios correos: valen comas, espacios o saltos de línea.</p></div>
        </div>
        <div class="panel-body">
          <div class="grid-invite">
            <div class="field">
              <label for="emails">Correos</label>
              <textarea class="input" id="emails"
                placeholder="ferran@club.com&#10;preparador@academia.es, analista@club.com"></textarea>
            </div>
            <div class="field">
              <label for="note">Nota (para ti)</label>
              <input class="input" id="note" placeholder="CF Bellvitge · pretemporada">
            </div>
            <div class="field">
              <label for="plan">Licencia al registrarse</label>
              <select class="input" id="plan">
                ${D.planes.filter(p => p !== 'suspendido')
                  .map(p => `<option value="${p}" ${p==='tester'?'selected':''}>${p}</option>`).join('')}
              </select>
              <button class="btn btn-primary" data-invitar style="margin-top:8px">Invitar</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ── lista de invitados ── -->
      <section class="panel">
        <div class="panel-head">
          <div><h2>Lista de acceso</h2>
            <p>${r.invitados} correo${r.invitados===1?'':'s'} autorizado${r.invitados===1?'':'s'}</p></div>
        </div>
        ${D.invitados.length ? `
        <table class="table">
          <thead><tr><th>Correo</th><th>Nota</th><th>Licencia</th><th>Estado</th><th></th></tr></thead>
          <tbody>${D.invitados.map(i => `
            <tr>
              <td><div class="mail">${esc(i.email)}</div>
                  <div class="sub">Invitado el ${fecha(i.created_at)}</div></td>
              <td style="color:var(--muted)">${esc(i.note) || '—'}</td>
              <td><span class="tag ${PLAN_TAG[i.plan]||'tag-neutral'}">${esc(i.plan)}</span></td>
              <td>${i.registered_at
                    ? `<span class="tag tag-ok">Registrado</span>`
                    : i.sent_at
                      ? `<span class="tag tag-warn">Invitado</span>
                         <div class="sub">Enlace enviado el ${fecha(i.sent_at)}</div>`
                      : `<span class="tag tag-neutral">Sin enviar</span>
                         <div class="sub">Puede registrarse a mano</div>`}</td>
              <td>${i.registered_at ? '' : `
                    <button class="btn btn-secondary btn-sm" data-reenviar="${i.id}"
                      title="Volver a mandar el enlace a ${esc(i.email)}"
                      >${i.sent_at ? 'Reenviar' : 'Enviar enlace'}</button>`}
                  <button class="btn btn-secondary btn-sm" data-quitar="${i.id}"
                    title="Quitar de la lista">Quitar</button></td>
            </tr>`).join('')}
          </tbody>
        </table>` : `<div class="empty">Todavía no has invitado a nadie.</div>`}
      </section>

      <!-- ── cuentas ── -->
      <section class="panel">
        <div class="panel-head">
          <div><h2>Cuentas y licencias</h2>
            <p>Cambia el plan o la fecha de caducidad y pulsa Guardar en esa fila.</p></div>
        </div>
        ${D.cuentas.length ? `
        <table class="table">
          <thead><tr><th>Cuenta</th><th>Tipo</th><th>Equipos</th><th>Último acceso</th>
            <th style="text-align:right">Licencia</th></tr></thead>
          <tbody>${D.cuentas.map(c => `
            <tr data-user="${c.id}">
              <td>
                <div class="mail">${esc(c.name) || esc(c.email)}
                  ${+c.is_admin ? '<span class="tag tag-accent" style="margin-left:6px">admin</span>' : ''}
                </div>
                <div class="sub">${esc(c.email)}${+c.con_google ? ' · Google' : ''}</div>
              </td>
              <td style="color:var(--muted)">${c.account_type === 'club' ? 'Club' : 'Profesional'}
                ${c.role ? `<div class="sub">${esc(c.role)}</div>` : ''}</td>
              <td class="num">${c.equipos}</td>
              <td style="color:var(--muted)">${fecha(c.last_login_at)}</td>
              <td>
                <div class="rowsel">
                  <select class="input" data-plan>
                    ${D.planes.map(p => `<option value="${p}" ${p===c.plan?'selected':''}>${p}</option>`).join('')}
                  </select>
                  <input class="input" type="date" data-until value="${c.plan_until || ''}"
                         title="Caduca el (opcional)">
                  <button class="btn btn-secondary btn-sm" data-guardar>Guardar</button>
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>` : `<div class="empty">Todavía no hay cuentas creadas.</div>`}
      </section>
    </div>`;
}

/* ── acciones ────────────────────────────────────────────────────── */
document.addEventListener('click', async e => {

  if(e.target.closest('[data-logout]')){
    await fetch(API + 'logout.php', {method:'POST', credentials:'same-origin'});
    location.href = 'acceso.html';
    return;
  }

  /* interruptores generales */
  const aj = e.target.closest('[data-ajuste]');
  if(aj){
    const clave = aj.dataset.ajuste;
    const valor = !aj.classList.contains('on');

    if(clave === 'registro_abierto' && valor &&
       !confirm('Vas a abrir el registro a cualquiera.\n\nDejará de hacer falta invitación para crear cuenta. ¿Seguimos?')) return;

    aj.classList.toggle('on', valor);          /* respuesta inmediata */
    const r = await call({action:'ajuste', clave, valor});
    if(r.ok){
      toast(valor ? 'Activado' : 'Desactivado', 'good');
      await load();
    } else {
      aj.classList.toggle('on', !valor);
      toast(r.error || 'No se ha podido guardar.', 'bad');
    }
    return;
  }

  /* interruptor de «se ofrece» dentro de la fila de tarifa */
  const act = e.target.closest('[data-activo]');
  if(act){
    const on = !act.classList.contains('on');
    act.classList.toggle('on', on);
    act.setAttribute('aria-checked', String(on));
    return;                                     /* se guarda con el botón */
  }

  /* guardar tarifa */
  const tf = e.target.closest('[data-tarifa]');
  if(tf){
    const fila = tf.closest('tr');
    const m = fila.querySelector('[data-m]').value.trim();
    const y = fila.querySelector('[data-y]').value.trim();
    const activo = fila.querySelector('[data-activo]').classList.contains('on');

    const num = v => v === '' || /^\d+([.,]\d{1,2})?$/.test(v);
    if(!num(m) || !num(y)){
      toast('Los importes solo admiten números, con dos decimales como mucho.', 'bad');
      return;
    }

    tf.disabled = true;
    const r = await call({action:'tarifa', id:fila.dataset.planId,
                          price_m:m, price_y:y, active:activo});
    tf.disabled = false;

    if(r.ok){ toast('Tarifa guardada', 'good'); await load(); }
    else toast(r.error || 'No se ha podido guardar.', 'bad');
    return;
  }

  const inv = e.target.closest('[data-invitar]');
  if(inv){
    const emails = document.getElementById('emails').value.trim();
    if(!emails){ toast('Escribe al menos un correo.', 'bad'); return; }

    inv.disabled = true;
    const r = await call({action:'invitar', emails,
      note: document.getElementById('note').value,
      plan: document.getElementById('plan').value});
    inv.disabled = false;

    if(!r.ok){ toast(r.error || 'No se ha podido invitar.', 'bad'); return; }

    const fallos = r.sin_correo || [];
    const partes = [];
    if(r.invitados.length){
      /* Lo que importa no es cuántos se autorizaron, sino a cuántos les
         ha llegado el enlace: sin correo, la invitación no llega sola. */
      const conCorreo = r.invitados.length - fallos.length;
      partes.push(`${conCorreo} invitado${conCorreo===1?'':'s'} por correo`);
      if(fallos.length) partes.push(`${fallos.length} sin poder enviar`);
    }
    if(r.repetidos.length) partes.push(`${r.repetidos.length} ya estaba${r.repetidos.length===1?'':'n'}`);
    if(r.invalidos.length) partes.push(`${r.invalidos.length} sin formato válido`);
    toast(partes.join(' · ') || 'Nada que añadir',
          r.invitados.length && !fallos.length ? 'good' : 'bad');

    if(fallos.length){
      alert('Estos correos quedaron autorizados pero no se les pudo enviar el enlace:\n\n' +
            fallos.join('\n') +
            '\n\nPueden registrarse a mano igualmente. Revisa mail_from en api/config.php ' +
            'y usa «Reenviar» cuando esté arreglado.');
    }

    await load();
    return;
  }

  const re = e.target.closest('[data-reenviar]');
  if(re){
    re.disabled = true;
    const r = await call({action:'reenviar_invitacion', id:+re.dataset.reenviar});
    re.disabled = false;
    if(r.ok){ toast('Enlace enviado a ' + r.email, 'good'); await load(); }
    else toast(r.error || 'No se ha podido enviar.', 'bad');
    return;
  }

  const q = e.target.closest('[data-quitar]');
  if(q){
    const fila = q.closest('tr');
    const mail = fila.querySelector('.mail').textContent.trim();
    if(!confirm(`¿Quitar ${mail} de la lista?\n\nSi ya tiene cuenta, la cuenta NO se borra: solo deja de poder registrarse de nuevo.`)) return;

    const r = await call({action:'quitar_invitacion', id:+q.dataset.quitar});
    if(r.ok){ toast('Quitado de la lista', 'good'); await load(); }
    else toast(r.error || 'No se ha podido quitar.', 'bad');
    return;
  }

  const g = e.target.closest('[data-guardar]');
  if(g){
    const fila  = g.closest('tr');
    const plan  = fila.querySelector('[data-plan]').value;
    const until = fila.querySelector('[data-until]').value;

    if(plan === 'suspendido' &&
       !confirm('Suspender cierra su sesión y le impide entrar. ¿Seguimos?')) return;

    g.disabled = true;
    const r = await call({action:'licencia', user_id:+fila.dataset.user, plan, until});
    g.disabled = false;

    if(r.ok){ toast('Licencia actualizada', 'good'); await load(); }
    else toast(r.error || 'No se ha podido guardar.', 'bad');
  }
});

/* ── carga ───────────────────────────────────────────────────────── */
async function load(){
  const r = await call(null).catch(() => ({status:0}));

  if(r.status === 401){ gate('Necesitas iniciar sesión para entrar aquí.', true); return; }
  if(r.status === 403){ gate('Tu cuenta no es administradora.', false); return; }
  if(!r.ok){ gate('No se ha podido hablar con el servidor.', false); return; }

  D = r;
  render();
}

load();
</script>
<script>
/* ═══════════════════════════════════════════════════════════════
   Menú de la cuenta · se abre al pulsar el bloque de abajo a la
   izquierda de la barra lateral. Idioma, tema, cuenta y salida.
   ═══════════════════════════════════════════════════════════════ */
(function(){
  const TEMAS = [
    ['sistema','Sistema','<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.6" y="2.6" width="12.8" height="9" rx="1.6"/><path d="M5.6 13.4h4.8" stroke-linecap="round"/></svg>'],
    ['claro','Claro','<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.4v1.6M8 13v1.6M1.4 8h1.6M13 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"/></svg>'],
    ['oscuro','Oscuro','<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M13.4 9.6A5.8 5.8 0 0 1 6.4 2.6a5.8 5.8 0 1 0 7 7z"/></svg>']
  ];
  const IDIOMAS = [['es','ES'],['ca','CA'],['en','EN']];

  /* localStorage no siempre está: en modo privado, con cookies
     bloqueadas o dentro de un iframe lanza excepción. Sin esta red, un
     fallo de almacenamiento tumbaría el menú entero. */
  const mem = {};
  const guarda = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){ mem[k] = v; } };
  const lee    = k => { try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } };

  function tema(){ return lee('pl-theme') || 'sistema'; }
  function aplicarTema(t){
    if(t === 'sistema') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    guarda('pl-theme', t);
  }

  /* Sincronización con la cuenta. Manda lo que hay guardado en el
     servidor: es lo que hace que la preferencia te siga de un
     dispositivo a otro. Cada pantalla la llama al cargar su estado. */
  window.plSyncPrefs = function(theme, locale){
    if(theme && theme !== tema()) aplicarTema(theme);
    if(locale) guarda('pl-locale', locale);
    document.dispatchEvent(new CustomEvent('pl-prefs'));
  };

  const me = document.querySelector('.me');
  if(!me) return;

  me.setAttribute('role','button');
  me.setAttribute('aria-haspopup','menu');
  me.setAttribute('aria-expanded','false');
  me.tabIndex = 0;

  const pop = document.createElement('div');
  pop.className = 'umenu';
  pop.hidden = true;
  document.body.appendChild(pop);

  function pintar(){
    const nombre = document.getElementById('meName')?.textContent || 'Tu cuenta';
    const rol    = document.getElementById('meRole')?.textContent || '';
    const t      = tema();
    const idioma = lee('pl-locale') || 'es';

    pop.innerHTML = `
      <div class="umenu-yo">
        <div class="umenu-n">${nombre}</div>
        <div class="umenu-s">${rol}</div>
      </div>

      <a class="umenu-it" href="perfil.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="5.4" r="2.6"/><path d="M2.9 13.6c0-2.6 2.3-4.2 5.1-4.2s5.1 1.6 5.1 4.2"/></svg>
        Tu perfil</a>
      <a class="umenu-it" href="perfil.html#suscripcion">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.8" y="3.4" width="12.4" height="9.2" rx="1.8"/><path d="M1.8 6.6h12.4" stroke-linecap="round"/></svg>
        Suscripción</a>
      <a class="umenu-it" href="perfil.html#datos">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10.4V2.6M5.3 5.3 8 2.6l2.7 2.7"/><path d="M2.6 9.8v3.6h10.8V9.8"/></svg>
        Tus datos</a>

      <div class="umenu-sep"></div>

      <div class="umenu-tit">Tema</div>
      <div class="umenu-ops" data-ops="theme">
        ${TEMAS.map(([k,v,ico]) => `<button class="umenu-op" data-v="${k}"
          aria-pressed="${t===k}" title="${v}">${ico}<span>${v}</span></button>`).join('')}
      </div>

      <div class="umenu-tit">Idioma</div>
      <div class="umenu-ops" data-ops="locale">
        ${IDIOMAS.map(([k,v]) => `<button class="umenu-op" data-v="${k}"
          aria-pressed="${idioma===k}">${v}</button>`).join('')}
      </div>

      <div class="umenu-sep"></div>

      <button class="umenu-it umenu-salir" data-salir>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 13.6H3.4V2.4h2.8"/><path d="M10.2 11 13.2 8l-3-3M13.2 8H6.6"/></svg>
        Cerrar sesión</button>`;
  }

  function abrir(){
    pintar();
    pop.hidden = false;
    const r = me.getBoundingClientRect();
    /* con la barra plegada el menú se sale por la izquierda: se ancla
       al borde derecho de la barra, nunca fuera de la ventana */
    pop.style.left = Math.max(8, r.left) + 'px';
    pop.style.bottom = (window.innerHeight - r.top + 8) + 'px';
    me.setAttribute('aria-expanded','true');
  }
  function cerrar(){
    pop.hidden = true;
    me.setAttribute('aria-expanded','false');
  }

  me.addEventListener('click', e => { e.stopPropagation(); pop.hidden ? abrir() : cerrar(); });
  me.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pop.hidden ? abrir() : cerrar(); }
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrar(); });
  document.addEventListener('click', e => { if(!pop.contains(e.target)) cerrar(); });

  pop.addEventListener('click', async e => {
    e.stopPropagation();

    const op = e.target.closest('.umenu-op');
    if(op){
      const grupo = op.closest('.umenu-ops').dataset.ops;
      const valor = op.dataset.v;
      [...op.parentNode.children].forEach(b => b.setAttribute('aria-pressed', String(b === op)));

      if(grupo === 'theme')  aplicarTema(valor);
      if(grupo === 'locale') guarda('pl-locale', valor);

      if(!/^https?:$/.test(location.protocol)) return;
      fetch('api/app.php', {method:'POST', headers:{'Content-Type':'application/json'},
        credentials:'same-origin',
        body:JSON.stringify({action:'preferencias',
          locale: lee('pl-locale') || 'es',
          theme:  tema()})}).catch(() => {});
      return;
    }

    if(e.target.closest('[data-salir]')){
      if(/^https?:$/.test(location.protocol)){
        await fetch('api/logout.php', {method:'POST', credentials:'same-origin'}).catch(() => {});
      }
      location.href = 'acceso.html';
    }
  });
})();
</script>
