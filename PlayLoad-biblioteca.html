<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayLoad · Biblioteca de tareas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  /* Tema antes de pintar: evita el fogonazo blanco al cargar en oscuro. */
  (function(){
    var t = 'sistema';
    try { t = localStorage.getItem('pl-theme') || 'sistema'; } catch(e){}
    if(t !== 'sistema') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<!-- Guardián de sesión: va antes que nada porque decide si esta cuenta
     debe estar aquí, y eso hay que saberlo antes de pintar. -->
<script src="js/sesion.js"></script>
<script src="js/cuentas.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   PlayLoad · biblioteca de tareas
   Mismos tokens Nocturne que el resto de la app.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --color-bg:#161826;
  --color-surface:#232532;
  --color-text:#e9e9ed;
  --color-accent:#9184d9;
  --color-accent-2:#a7a1db;
  --color-divider:color-mix(in srgb,#e9e9ed 16%,transparent);

  --color-neutral-100:#f3f5fe; --color-neutral-200:#e4e7f5; --color-neutral-300:#cfd3e5;
  --color-neutral-400:#b2b6ca; --color-neutral-500:#9397ab; --color-neutral-600:#75798c;
  --color-neutral-700:#595d6c; --color-neutral-800:#3f424d; --color-neutral-900:#292b31;

  --color-accent-100:#f5f4ff; --color-accent-200:#e7e5fe; --color-accent-300:#d2cefd;
  --color-accent-400:#b5abfc; --color-accent-500:#968ae0; --color-accent-600:#796cbf;
  --color-accent-700:#5d5294; --color-accent-800:#423a6a; --color-accent-900:#2b2741;

  --color-section:#262a60; --color-section-glow:#353b80; --color-section-ghost:#4c5397;

  --color-ok:#9fd984;   --color-ok-bg:#2c3a2a;
  --color-warn:#d9a184; --color-warn-bg:#3a2f28;
  --color-risk:#d9848d; --color-risk-bg:#3a2a2d;

  --font-heading:"Inter",system-ui,sans-serif;
  --font-heading-weight:500;
  --font-body:"Inter",system-ui,sans-serif;

  --space-1:2.8px; --space-2:5.6px; --space-3:8.4px;
  --space-4:11.2px; --space-6:16.8px; --space-8:22.4px;

  --radius-sm:4px; --radius-md:8px; --radius-lg:14px;

  --shadow-sm:0 0 0 1px #3f424d;
  --shadow-md:0 0 0 1px #595d6c,0 6px 18px rgba(0,0,0,.55);
  --shadow-lg:0 0 0 1px #9397ab,0 16px 40px rgba(0,0,0,.65);

  --rail:246px;
  --muted:color-mix(in srgb,var(--color-text) 55%,transparent);
  --muted-2:color-mix(in srgb,var(--color-text) 40%,transparent);
  --hair:color-mix(in srgb,var(--color-text) 9%,transparent);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--color-bg);color:var(--color-text);
  font-family:var(--font-body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5,h6{font-family:var(--font-heading);font-weight:var(--font-heading-weight);
  line-height:1.12;letter-spacing:-.015em;margin:0}
a{color:var(--color-accent);text-decoration:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
svg{display:block}

/* — firmas del sistema — */
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2)}
@keyframes plPulse{0%,100%{opacity:.3}50%{opacity:1}}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--color-accent);
  animation:plPulse 2.6s ease-in-out infinite;flex:none}
.mark{width:24px;height:24px;border-radius:var(--radius-sm);border:1px solid var(--color-accent);
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;
  color:var(--color-accent);font-family:var(--font-heading);flex:none}
.num{font-family:var(--font-heading);font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

/* — botones — */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  text-decoration:none;font-family:var(--font-heading);font-weight:var(--font-heading-weight);
  font-size:14px;line-height:1.2;color:var(--color-text);background:transparent;
  border:1px solid transparent;padding:var(--space-2) calc(var(--space-3)*1.2);
  border-radius:var(--radius-md);transition:background .14s ease,border-color .14s ease,color .14s ease}
.btn-primary{color:var(--color-accent);border-color:var(--color-accent)}
.btn-primary:hover{background:color-mix(in srgb,var(--color-accent) 12%,transparent)}
.btn-secondary{border-color:var(--color-divider)}
.btn-secondary:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.btn-ghost{color:var(--color-accent);padding-inline:var(--space-1)}
.btn-ghost:hover{background:color-mix(in srgb,var(--color-accent) 10%,transparent)}
.btn-icon{width:34px;height:34px;padding:0;border-color:var(--color-divider);color:var(--muted);position:relative}
.btn-icon:hover{color:var(--color-text);background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.btn-sm{font-size:13px;padding:4px 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[hidden]{display:none}

/* — inputs — */
.input{width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;
  color:var(--color-text);caret-color:var(--color-accent);background:var(--color-surface);
  border:1px solid var(--color-divider);border-radius:var(--radius-md)}
.input::placeholder{color:var(--muted-2)}
.input:hover{border-color:color-mix(in srgb,var(--color-text) 45%,transparent)}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0}
.input:disabled{opacity:.6;cursor:default;background:color-mix(in srgb,var(--color-text) 4%,transparent)}
textarea.input{min-height:78px;resize:vertical;line-height:1.45}
select.input{appearance:none;padding-right:28px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat}

/* — tags — */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.02em;
  padding:3px 10px;border-radius:calc(var(--radius-md)*.75);white-space:nowrap}
.tag-accent{background:var(--color-accent-800);color:var(--color-accent-100)}
.tag-neutral{background:var(--color-neutral-800);color:var(--color-neutral-100)}
.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent)}
.tag-ok{background:var(--color-ok-bg);color:var(--color-ok)}
.tag-warn{background:var(--color-warn-bg);color:var(--color-warn)}
.tag-risk{background:var(--color-risk-bg);color:var(--color-risk)}

/* — tarjetas — */
.card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);
  padding:16px 18px 0}
.card-title{font-family:var(--font-heading);font-weight:var(--font-heading-weight);
  font-size:16px;line-height:1.2;letter-spacing:-.01em}
.panel{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;overflow:hidden}
.panel-body{padding:18px}

/* ═══════════════ LAYOUT ═══════════════ */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}

/* — barra lateral — */
.rail{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:var(--rail-bg);
  border-right:1px solid var(--hair);
}
.rail-top{padding:16px 18px 12px;display:flex;align-items:center;gap:10px;
  font-family:var(--font-heading);font-weight:500;font-size:17px;
  color:inherit;text-decoration:none}
a.rail-top:hover .mark{background:color-mix(in srgb,var(--color-accent) 18%,transparent)}
a.rail-top:hover{color:var(--color-accent)}
.club{margin:0 12px 4px;padding:9px 10px;border-radius:var(--radius-md);
  border:1px solid var(--color-divider);display:flex;align-items:center;gap:9px;cursor:pointer}
.club:hover{border-color:var(--color-accent)}
.club-badge{width:26px;height:26px;border-radius:var(--radius-sm);flex:none;overflow:hidden;
  background:linear-gradient(150deg,var(--color-section-glow),var(--color-section));
  display:flex;align-items:center;justify-content:center;font-size:10px;
  font-family:var(--font-heading);color:var(--color-neutral-100);letter-spacing:.02em}
.club-badge img{width:100%;height:100%;object-fit:contain;background:#fff}
.club-name{font-size:13.5px;line-height:1.25}
.club-sub{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
.nav{flex:1;overflow-y:auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;
  scrollbar-width:thin;scrollbar-color:var(--color-neutral-800) transparent}
.nav-group{margin:14px 0 4px;padding:0 10px;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted-2)}
.nav-group:first-child{margin-top:2px}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;padding:7px 10px;
  border-radius:var(--radius-md);color:color-mix(in srgb,var(--color-text) 72%,transparent);
  font-size:13.5px;line-height:1.3;transition:background .14s ease,color .14s ease}
.nav-item svg{width:15px;height:15px;flex:none;opacity:.72}
.nav-item:hover{background:color-mix(in srgb,var(--color-text) 6%,transparent);color:var(--color-text)}
.nav-item:hover svg{opacity:1}
.nav-item[aria-current="page"]{color:var(--color-accent);
  background:color-mix(in srgb,var(--color-accent) 13%,transparent)}
.nav-item[aria-current="page"] svg{opacity:1}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;
  width:2px;border-radius:0 2px 2px 0;background:var(--color-accent)}
.nav-count{margin-left:auto;font-size:10.5px;padding:1px 6px;border-radius:20px;
  background:var(--color-neutral-800);color:var(--color-neutral-200)}
.rail-foot{padding:10px 12px 14px;border-top:1px solid var(--hair)}
.me{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--radius-md);cursor:pointer}
.me:hover{background:color-mix(in srgb,var(--color-text) 6%,transparent)}
.avatar{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:11.5px;font-family:var(--font-heading);
  background:var(--color-accent-800);color:var(--color-accent-100)}
.me-name{font-size:13.5px;line-height:1.2}
.me-role{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}

/* — barra superior — */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:var(--space-6);
  padding:12px 30px;background:color-mix(in srgb,var(--color-bg) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.crumbs b{font-weight:400;color:var(--color-text)}
.crumbs span.sep{color:var(--muted-2)}
.search{position:relative;margin-left:auto;width:min(280px,26vw)}
.search .input{padding-left:32px;height:34px;min-height:34px}
.search svg{position:absolute;left:10px;top:9px;width:15px;height:15px;color:var(--muted-2)}

/* — contenido — */
.content{padding:26px 30px 56px;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-8);flex-wrap:wrap}
.page-head h1{font-size:31px;letter-spacing:-.022em;margin:0 0 6px}
.head-meta{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}

/* ═══════════════ BIBLIOTECA ═══════════════
   Lista de tareas a la izquierda, ficha de la elegida a la derecha —
   igual de la cuenta que el resto de la app, no de un equipo: los
   mismos ejercicios sirven en cualquiera de los equipos que se
   gestionen. */
.bib-wrap{display:grid;gap:16px;align-items:start;
  grid-template-columns:minmax(300px,380px) minmax(0,1fr)}
@media (max-width:1180px){ .bib-wrap{grid-template-columns:minmax(0,1fr)} }

.filtros{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:12px 14px;border-bottom:1px solid var(--hair)}
.filtro{padding:5px 10px;border-radius:20px;font-size:12px;cursor:pointer;
  border:1px solid var(--color-divider);background:transparent;
  color:color-mix(in srgb,var(--color-text) 74%,transparent);display:inline-flex;
  align-items:center;gap:5px}
.filtro:hover{border-color:var(--color-accent);color:var(--color-accent)}
.filtro[aria-pressed="true"]{border-color:var(--color-accent);color:var(--color-accent);
  background:color-mix(in srgb,var(--color-accent) 14%,transparent)}
.filtro-punto{width:7px;height:7px;border-radius:50%;flex:none}

.lista-tareas{display:flex;flex-direction:column;max-height:calc(100vh - 230px);overflow:auto}
.tarea-it{--tipo:var(--color-accent);display:flex;align-items:center;gap:11px;padding:11px 14px;
  width:100%;background:transparent;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;
  position:relative}
.tarea-it+.tarea-it{border-top:1px solid var(--hair)}
.tarea-it:hover{background:color-mix(in srgb,var(--color-text) 4%,transparent)}
.tarea-it[aria-current="true"]{background:color-mix(in srgb,var(--tipo) 14%,transparent);
  box-shadow:inset 2px 0 0 var(--tipo)}
.tarea-ico{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;
  justify-content:center;background:color-mix(in srgb,var(--tipo) 22%,transparent);color:var(--tipo)}
.tarea-ico svg{width:15px;height:15px}
.tarea-cuerpo{min-width:0;flex:1}
.tarea-t{font-size:13.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tarea-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;
  font-size:11px;color:var(--muted-2);letter-spacing:.03em}
.tarea-pz{flex:none;color:var(--color-accent);opacity:.8}
.tarea-pz svg{width:14px;height:14px}

/* — ficha de la tarea — */
.det-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;
  padding:22px 26px;border-bottom:1px solid var(--hair)}
.det-head h2{font-size:24px;letter-spacing:-.02em;margin:0 0 6px}
.det-acc{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@keyframes plAbre{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#detalle .det-head,#detalle .ficha-tarea{animation:plAbre .22s ease both}

.ficha-tarea{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr));padding:20px 26px}
.ficha-tarea .field-desc{grid-column:1 / -1}
.ficha-tarea .field-mat{grid-column:1 / -1}

.pizarra-bloque{margin:0 26px 22px;padding:16px;border-radius:var(--radius-lg);
  border:1px dashed var(--color-divider);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pizarra-vacia{color:var(--muted);font-size:13px;flex:1;min-width:180px}
.pizarra-preview{width:172px;height:111px;border-radius:10px;overflow:hidden;flex:none;
  border:1px solid var(--color-divider);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.pizarra-preview svg{width:100%;height:100%;display:block}
.pizarra-acc{display:flex;gap:8px;flex-wrap:wrap}

/* — responsive — */
@media (max-width:1080px){
  :root{--rail:64px}
  .rail-top span:last-child,.club-text,.nav-item span,.nav-count,.me-text{display:none}
  .rail-top,.nav,.rail-foot{padding-left:8px;padding-right:8px}
  .club{margin:0 8px 4px;justify-content:center;padding:8px}
  .nav-item{justify-content:center;padding:9px 0}
  .nav-item[aria-current="page"]::before{left:-8px}
  .nav-group{text-align:center;padding:0;font-size:9px;overflow:hidden;text-overflow:clip;opacity:.5}
  .me{justify-content:center}
  .content,.topbar{padding-left:18px;padding-right:18px}
}
/* — barra lateral contraída a mano, con el botón de la esquina — */
:root[data-rail="contraido"]{--rail:64px}
:root[data-rail="contraido"] .rail-top span:last-child,
:root[data-rail="contraido"] .club-text,
:root[data-rail="contraido"] .club svg,
:root[data-rail="contraido"] .nav-item span,
:root[data-rail="contraido"] .nav-count,
:root[data-rail="contraido"] .me-text{display:none}
:root[data-rail="contraido"] .rail-top,
:root[data-rail="contraido"] .nav,
:root[data-rail="contraido"] .rail-foot{padding-left:8px;padding-right:8px}
:root[data-rail="contraido"] .club{justify-content:center;padding:8px}
:root[data-rail="contraido"] .nav-item{justify-content:center;padding:9px 0}
:root[data-rail="contraido"] .nav-item[aria-current="page"]::before{left:-8px}
:root[data-rail="contraido"] .nav-group{text-align:center;padding:0;font-size:9px;overflow:hidden;text-overflow:clip;opacity:.5}
:root[data-rail="contraido"] .me{justify-content:center}
:root[data-rail="contraido"] .rail-toggle svg{transform:rotate(180deg)}

.rail-toggle{position:absolute;top:18px;right:-12px;width:24px;height:24px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--color-surface);border:1px solid var(--color-divider);
  color:var(--muted);cursor:pointer;padding:0;z-index:50;
  transition:color .14s ease,border-color .14s ease}
.rail-toggle:hover{color:var(--color-text);border-color:var(--color-accent)}
.rail-toggle svg{width:12px;height:12px;transition:transform .18s ease;pointer-events:none}
@media (max-width:1080px){ .rail-toggle{display:none} }

@media (max-width:760px){
  .search{display:none}
  .page-head h1{font-size:26px}
  .ficha-tarea{grid-template-columns:1fr}
}

/* — estado vacío — */
.vacio{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  text-align:center;padding:44px 26px;border:1px dashed var(--color-neutral-800);
  border-radius:var(--radius-lg)}
.vacio-ico{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--color-accent) 16%,transparent);color:var(--color-accent-300);margin-bottom:2px}
.vacio h3{font-size:17px}
.vacio p{margin:0;font-size:13.5px;line-height:1.6;color:var(--muted);max-width:44ch}
.vacio .btn{margin-top:4px}

/* — diálogos — */
.dialog-backdrop{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:16px;
  background:color-mix(in srgb,#0b0d14 70%,transparent);backdrop-filter:blur(3px)}
.dialog-backdrop.open{display:grid}
.dialog{width:min(470px,100%);display:flex;flex-direction:column;gap:15px;padding:22px;
  border-radius:var(--radius-lg);background:var(--color-surface);
  border:1px solid var(--color-neutral-800);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.dialog h2{font-size:20px}
.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:4px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:13px;color:var(--muted)}
.p-sub{font-size:12.5px;color:var(--muted-2);margin:0}
.dialog-xl{width:min(980px,97vw);max-height:94vh}

/* — editor de pizarra (estilo Paint) — */
.dialog-pz{width:min(1220px,98vw);max-width:98vw;padding:0;gap:0;overflow:hidden;
  max-height:96vh;display:flex;flex-direction:column}

.pz-head{display:flex;align-items:center;gap:14px;padding:12px 16px;
  border-bottom:1px solid var(--line);flex:none}
.pz-head h2{font-size:17px;margin:0;line-height:1.2}
.pz-head .pz-sub{font-size:12.5px;color:var(--muted-2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pz-head-acc{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.pz-head-acc .btn-icon{width:32px;height:32px}
.pz-head-acc .btn-icon svg{width:16px;height:16px}

.pz-main{display:grid;grid-template-columns:auto minmax(0,1fr);flex:1;min-height:0}

/* paleta vertical de herramientas, como la caja de Paint */
.pz-paleta{display:grid;grid-template-columns:repeat(2,34px);gap:4px;align-content:start;
  padding:10px 9px;border-right:1px solid var(--line);background:var(--rail-bg);
  overflow-y:auto;flex:none}
.pz-paleta .pz-sep{grid-column:1 / -1;height:1px;background:var(--line);margin:5px 1px}
.pz-tool{width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;border:1px solid transparent;background:transparent;
  color:var(--muted);cursor:pointer;padding:0}
.pz-tool svg{width:19px;height:19px;pointer-events:none}
.pz-tool:hover{color:var(--color-text);background:color-mix(in srgb,var(--color-text) 9%,transparent)}
.pz-tool[aria-pressed="true"]{color:var(--color-accent);border-color:var(--color-accent);
  background:color-mix(in srgb,var(--color-accent) 16%,transparent)}

.pz-derecha{display:flex;flex-direction:column;min-width:0;min-height:0}

.pz-barra{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px;
  border-bottom:1px solid var(--line);flex:none}
.pz-grupo{display:flex;align-items:center;gap:5px}
.pz-grupo>.eyebrow{margin-right:1px;white-space:nowrap}
.pz-grupo[hidden]{display:none}

.pz-color{width:21px;height:21px;border-radius:50%;cursor:pointer;padding:0;
  border:2px solid transparent;box-shadow:0 0 0 1px var(--color-divider);
  transition:transform .12s ease}
.pz-color[aria-pressed="true"]{border-color:var(--color-surface);
  box-shadow:0 0 0 2px var(--color-accent);transform:scale(1.1)}

.pz-grosor{width:30px;height:26px;border-radius:7px;cursor:pointer;padding:0;
  border:1px solid var(--color-divider);background:transparent;color:var(--muted);
  display:flex;align-items:center;justify-content:center}
.pz-grosor i{display:block;width:15px;background:currentColor;border-radius:4px}
.pz-grosor[aria-pressed="true"]{color:var(--color-accent);border-color:var(--color-accent);
  background:color-mix(in srgb,var(--color-accent) 12%,transparent)}

.pz-campo-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;
  font:inherit;font-size:12px;cursor:pointer;color:var(--muted);
  border:1px solid var(--color-divider);background:transparent}
.pz-campo-btn svg{width:17px;height:12px;flex:none}
.pz-campo-btn:hover{color:var(--color-text);border-color:var(--color-accent)}
.pz-campo-btn[aria-pressed="true"]{color:var(--color-accent);border-color:var(--color-accent);
  background:color-mix(in srgb,var(--color-accent) 12%,transparent)}

.pz-equipo{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:20px;
  font:inherit;font-size:12px;cursor:pointer;color:var(--muted);
  border:1px solid var(--color-divider);background:transparent}
.pz-equipo::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--eq);
  box-shadow:0 0 0 1px rgba(0,0,0,.35) inset}
.pz-equipo:hover{color:var(--color-text)}
.pz-equipo[aria-pressed="true"]{color:var(--color-text);border-color:var(--color-accent);
  background:color-mix(in srgb,var(--color-accent) 12%,transparent)}

.pz-sel-panel{background:color-mix(in srgb,var(--color-accent) 9%,transparent)}
.pz-sel-panel[hidden]{display:none}
.pz-sel-panel .input{width:auto;min-height:30px;padding:4px 8px;font-size:13px}

.pz-lienzo{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:14px;background:var(--color-bg);overflow:auto;position:relative}
.pz-marco{width:100%;max-width:calc((96vh - 260px) * 700 / 450);border-radius:var(--radius-lg);
  overflow:hidden;border:1px solid var(--color-divider);line-height:0;
  box-shadow:0 10px 30px rgba(0,0,0,.28)}
.pz-svg{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair;
  -webkit-user-select:none;user-select:none}
.pz-svg[data-herramienta="mover"]{cursor:default}
.pz-svg[data-herramienta="texto"]{cursor:text}
.pz-svg[data-herramienta="goma"]{cursor:not-allowed}
.pz-el{cursor:pointer}
.pz-el.pz-sel{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px var(--color-accent))}
.pz-handle{cursor:grab;fill:#fff;stroke:var(--color-accent);stroke-width:2.5}
.pz-handle[data-handle="esc"]{cursor:nwse-resize}
.pz-handle[data-handle="rot"]{cursor:grab}
.pz-handle-tallo{stroke:var(--color-accent);stroke-width:1.4;stroke-dasharray:3 3;opacity:.7}

/* menú flotante que aparece sobre el objeto seleccionado */
.pz-flotante{position:absolute;top:0;left:0;z-index:5;display:flex;gap:2px;padding:3px;
  border-radius:20px;background:var(--color-surface);border:1px solid var(--color-divider);
  box-shadow:0 6px 18px rgba(0,0,0,.28);transform:translate(-50%,-100%)}
.pz-flotante[hidden]{display:none}
.pz-flotante.pz-flot-abajo{transform:translate(-50%,0)}
.pz-flot-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:0;background:transparent;color:var(--color-text);cursor:pointer;padding:0}
.pz-flot-btn svg{width:16px;height:16px;pointer-events:none}
.pz-flot-btn:hover{background:color-mix(in srgb,var(--color-accent) 18%,transparent);color:var(--color-accent)}
.pz-flot-borrar:hover{background:color-mix(in srgb,#e2483f 20%,transparent);color:#e2483f}

.pz-pie{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;
  border-top:1px solid var(--line);flex:none}
.pz-hint{font-size:12.5px;color:var(--muted-2);flex:1;min-width:160px}
.pz-pie-acc{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:820px){
  .pz-main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .pz-paleta{grid-template-columns:repeat(auto-fill,34px);border-right:0;
    border-bottom:1px solid var(--line);justify-content:center}
  .pz-paleta .pz-sep{display:none}
  .pz-marco{max-width:none}
}

/* ═══════════ TEMA CLARO ═══════════ */
:root{ --input-bg:#191b26; --rail-bg:#0f111a; --sombra:0 20px 50px rgba(0,0,0,.55); }

:root[data-theme="claro"]{
  --color-bg:#f1f2f7; --color-surface:#ffffff; --color-text:#161822;
  --line:#d8dae4; --color-divider:color-mix(in srgb,#161822 18%,transparent);
  --input-bg:#f7f8fc; --rail-bg:#ffffff;
  --color-accent:#6d5fc6; --color-accent-100:#2c2554; --color-accent-200:#3a3170;
  --color-accent-300:#584ab4; --color-accent-400:#4b3ea6; --color-accent-800:#e8e5fb;
  --color-neutral-100:#1d1f2a; --color-neutral-200:#3f4250; --color-neutral-300:#5a5d6c;
  --color-neutral-600:#8b8f9e; --color-neutral-700:#c9ccd8; --color-neutral-800:#e4e6ef;
  --color-ok:#3d8a4f;   --color-ok-bg:#e4f2e6;
  --color-warn:#9c6329; --color-warn-bg:#f8eddf;
  --color-risk:#b04450; --color-risk-bg:#fae4e6;
  --sombra:0 16px 40px rgba(22,24,34,.14);
  --shadow-sm:0 0 0 1px #d8dae4;
  --shadow-md:0 0 0 1px #c9ccd8,0 6px 18px rgba(22,24,34,.10);
  --muted:color-mix(in srgb,var(--color-text) 70%,transparent);
  --muted-2:color-mix(in srgb,var(--color-text) 52%,transparent);
  --hair:color-mix(in srgb,var(--color-text) 13%,transparent);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="oscuro"]):not([data-theme="claro"]){
    --color-bg:#f1f2f7; --color-surface:#ffffff; --color-text:#161822;
    --line:#d8dae4; --color-divider:color-mix(in srgb,#161822 18%,transparent);
    --input-bg:#f7f8fc; --rail-bg:#ffffff;
    --color-accent:#6d5fc6; --color-accent-100:#2c2554; --color-accent-200:#3a3170;
    --color-accent-300:#584ab4; --color-accent-400:#4b3ea6; --color-accent-800:#e8e5fb;
    --color-neutral-100:#1d1f2a; --color-neutral-200:#3f4250; --color-neutral-300:#5a5d6c;
    --color-neutral-600:#8b8f9e; --color-neutral-700:#c9ccd8; --color-neutral-800:#e4e6ef;
    --color-ok:#3d8a4f;   --color-ok-bg:#e4f2e6;
    --color-warn:#9c6329; --color-warn-bg:#f8eddf;
    --color-risk:#b04450; --color-risk-bg:#fae4e6;
    --sombra:0 16px 40px rgba(22,24,34,.14);
    --shadow-sm:0 0 0 1px #d8dae4;
    --shadow-md:0 0 0 1px #c9ccd8,0 6px 18px rgba(22,24,34,.10);
    --muted:color-mix(in srgb,var(--color-text) 70%,transparent);
    --muted-2:color-mix(in srgb,var(--color-text) 52%,transparent);
    --hair:color-mix(in srgb,var(--color-text) 13%,transparent);
  }
}
body{transition:background .18s ease,color .18s ease}

/* ═══════════ MENÚ DE LA CUENTA ═══════════ */
.me{cursor:pointer}
.umenu{position:fixed;z-index:80;width:250px;padding:8px;border-radius:12px;
  background:var(--color-surface);border:1px solid var(--line);box-shadow:var(--sombra);
  display:flex;flex-direction:column;gap:2px;
  font-family:"Inter",system-ui,sans-serif;color:var(--color-text)}
.umenu[hidden]{display:none}
.umenu-yo{padding:9px 10px 10px}
.umenu-n{font-size:14px;line-height:1.25}
.umenu-s{font-size:12px;color:var(--muted-2);margin-top:2px}
.umenu-it{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;
  border-radius:8px;font-size:13.5px;color:var(--muted);text-align:left;
  text-decoration:none;background:transparent;border:0;cursor:pointer}
.umenu-it svg{width:15px;height:15px;flex:none;opacity:.85}
.umenu-it:hover{background:color-mix(in srgb,var(--color-text) 8%,transparent);color:var(--color-text)}
.umenu-salir{color:var(--color-risk)}
.umenu-salir:hover{background:color-mix(in srgb,var(--color-risk) 14%,transparent);color:var(--color-risk)}
.umenu-sep{height:1px;background:var(--line);margin:6px 4px}
.umenu-tit{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;

.umenu-ops{display:flex;gap:5px;padding:0 6px 4px}
.umenu-op{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:7px 6px;border-radius:7px;border:1px solid var(--line);background:transparent;
  font-size:11.5px;color:var(--muted);cursor:pointer}
.umenu-op svg{width:14px;height:14px}
.umenu-op:hover{color:var(--color-text);border-color:var(--color-accent)}
.umenu-op[aria-pressed="true"]{color:var(--color-accent-300);border-color:var(--color-accent);
  background:color-mix(in srgb,var(--color-accent) 12%,transparent)}

/* — selector de cuentas — */
.umenu-accounts{display:flex;flex-direction:column;gap:2px;margin-bottom:2px}
.umenu-acc{position:relative;display:flex;align-items:center}
.umenu-acc-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 34px 8px 10px;
  border-radius:8px;font-size:13px;color:var(--muted);text-align:left;
  background:transparent;border:0;cursor:pointer}
.umenu-acc.is-active .umenu-acc-btn{cursor:default;color:var(--color-text)}
.umenu-acc-btn:hover{background:color-mix(in srgb,var(--color-text) 8%,transparent);color:var(--color-text)}
.umenu-acc-avatar{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:10px;font-family:var(--font-heading);
  background:var(--color-accent-800);color:var(--color-accent-100)}
.umenu-acc-text{flex:1;min-width:0;display:flex;flex-direction:column}
.umenu-acc-name{font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.umenu-acc-sub{font-size:11px;color:var(--muted-2)}
.umenu-acc-check{flex:none;width:15px;height:15px;color:var(--color-accent)}
.umenu-acc-check svg{width:100%;height:100%}
.umenu-acc-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:0;color:var(--muted-2);cursor:pointer;opacity:0}
.umenu-acc-x svg{width:11px;height:11px}
.umenu-acc:hover .umenu-acc-x{opacity:1}
.umenu-acc-x:hover{background:color-mix(in srgb,var(--color-risk) 16%,transparent);color:var(--color-risk)}
</style>
</head>

<div class="app">


  <!-- ══════════ BARRA LATERAL ══════════ -->
  <aside class="rail" id="rail"></aside>

  <!-- ══════════ PRINCIPAL ══════════ -->
  <div class="main">

        <div>
          <h1>Biblioteca de tareas</h1>

            <span class="tag tag-outline"><span class="pulse"></span>De tu cuenta, para todos tus equipos</span>
            <span id="bibCont"></span>
          </div>
        </div>
      </div>

      <section class="bib-wrap">

</div>

<!-- ══════════ DIÁLOGO: EDITOR DE PIZARRA ══════════ -->
<div class="dialog-backdrop" id="dlgPizarra">
  <div class="dialog dialog-pz" role="dialog" aria-modal="true" aria-labelledby="dlgPizarraT">

    <div class="pz-head">

      </div>
      <div class="pz-head-acc">
        <button class="btn btn-icon" id="pzDeshacer" type="button" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">

          </span>
        </div>
      </div>
    </div>

  </div>
</div>


<script>
/* ═══════════════════════════════════════════════════════════════
   Biblioteca de tareas · las tareas reutilizables con las que se
   montan los bloques de una sesión, y el editor de pizarra con el
   que se dibujan las de campo (conos, picas, jugadores, balones,
   porterías, flechas y zonas).

   Es de la cuenta, no de un equipo: el mismo entrenador con varios
   equipos ve y reutiliza las mismas tareas en todos.
   ═══════════════════════════════════════════════════════════════ */
const API  = 'api/';
const DEMO = !/^https?:$/.test(location.protocol);

function respuesta(status, b){
  return (b && typeof b.ok !== 'undefined')
    ? {status, ...b}
    : {status, ok:false, error:'El servidor no ha contestado como se esperaba.'};
}
async function get(qs){
  const r = await fetch(API + 'app.php?' + qs, {credentials:'same-origin'});
  let b = null; try { b = await r.json(); } catch(e){}
  return respuesta(r.status, b);
}
async function post(data){
  const r = await fetch(API + 'app.php', {method:'POST',
    headers:{'Content-Type':'application/json'}, credentials:'same-origin',
    body:JSON.stringify(data)});
  let b = null; try { b = await r.json(); } catch(e){}
  return respuesta(r.status, b);
}

function toast(msg, kind){
  let t = $('toast');
  if(!t){
    t = document.createElement('div'); t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:95;' +
      'padding:12px 18px;border-radius:8px;font-size:14px;max-width:min(520px,90vw);text-align:center;' +
      'background:var(--color-surface);border:1px solid var(--color-neutral-700);' +
      'box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .18s ease;pointer-events:none';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.color = kind === 'bad' ? 'var(--color-risk)' : 'var(--color-text)';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { t.style.opacity = '0'; }, 4000);
}

/* ── la lista de la izquierda ───────────────────────────────── */
function tagsTarea(e){
  const t = [];
  if(e.duration_min) t.push(`<span>${e.duration_min}'</span>`);
  if(e.intensity)     t.push(`<span>RPE ${e.intensity}</span>`);
  if(e.space)          t.push(`<span>${esc(ESPACIOS[e.space] || e.space)}</span>`);
  return t.join(' · ');
}

function coincide(e){
  if(filtroTipo !== 'todos' && e.block_type !== filtroTipo) return false;
  if(!busca) return true;
  return e.name.toLowerCase().includes(busca);
}

function pintarFiltros(){
  const caja = $('filtrosTipo');
  const chip = (val, label, color) => `<button class="filtro" data-filtro-tipo="${val}"
      aria-pressed="${filtroTipo === val}">${color ? `<span class="filtro-punto" style="background:${color}"></span>` : ''}${label}</button>`;

  caja.innerHTML = chip('todos', 'Todos') +
    Object.entries(BLOQUE_TIPOS).map(([k,v]) => chip(k, v.label, v.color)).join('');
}

function pintarLista(){
  const caja = $('listaTareas');
  const vis  = D.ejercicios.filter(coincide).sort((a,b) => a.name.localeCompare(b.name, 'es'));

  $('bibCont').textContent = D.ejercicios.length
    ? `${vis.length} de ${D.ejercicios.length} tarea${D.ejercicios.length===1?'':'s'}` : '';
  if($('navTareas')) $('navTareas').textContent = D.ejercicios.length || '';

  if(!vis.length){
    caja.innerHTML = `
      <div class="vacio" style="margin:16px;padding:30px 18px">
        <h3>${D.ejercicios.length ? 'Nada con ese filtro' : 'Ninguna tarea todavía'}</h3>
        <p>${D.ejercicios.length
             ? 'Prueba con otro tipo o borra la búsqueda.'
             : 'Crea la primera tarea de tu biblioteca.'}</p>
        ${D.ejercicios.length ? '' : '<button class="btn btn-primary btn-sm" data-nueva-tarea>Nueva tarea</button>'}
      </div>`;
    return;
  }

  caja.innerHTML = vis.map(e => {
    const tipo = BLOQUE_TIPOS[e.block_type] || BLOQUE_TIPOS.otro;
    const tags = tagsTarea(e);
    return `<button class="tarea-it" data-abrir="${e.id}" style="--tipo:${tipo.color}"
              aria-current="${D.activo && D.activo.id === e.id}">
      <span class="tarea-ico">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round"><path d="${tipo.icono}"/></svg>
      </span>
      <span class="tarea-cuerpo">
        <span class="tarea-t">${esc(e.name)}</span>
        <span class="tarea-m">${esc(tipo.label)}${tags ? ' · ' + tags : ''}</span>
      </span>
      ${e.diagram ? `<span class="tarea-pz" title="Tiene dibujo en la pizarra">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.4"/><circle cx="6" cy="7.5" r="1.3"/><path d="M2 11.5 6 8l2.5 2 2-1.5L14 11"/></svg>
      </span>` : ''}
    </button>`;
  }).join('');
}

async function cargarEjercicios(){
  D.ejercicios = [];
  if(DEMO){ pintarLista(); return; }
  const r = await get('action=ejercicios').catch(() => null);
  if(r && r.ok) D.ejercicios = r.ejercicios || [];
  pintarLista();

function nuevaFicha(){
  D.activo = {id:0, name:'', block_type:'otro', space:'', duration_min:null,
              intensity:null, materials:'', description:'', diagram:null};
  pintarFicha();
  pintarLista();
  $('tName') && $('tName').focus();
}

function abrirFicha(id){
  D.activo = D.ejercicios.find(e => e.id === id) || null;
  pintarFicha();
  pintarLista();
}

async function guardarFicha(){
  if(!D.activo) return;
  if(DEMO){ toast('Sin servidor no se pueden guardar cambios: esta es la vista de diseño.'); return; }
  const datos = leerFicha();
  if(!datos.name.trim()){ toast('La tarea necesita un nombre.', 'bad'); return; }

  const payload = {...datos};
  if(D.activo.id){
    payload.action = 'editar_ejercicio';
    payload.exercise_id = D.activo.id;
    payload.diagram = D.activo.diagram || '';
  } else {
    payload.action = 'crear_ejercicio';
    payload.team_id = D.teams[0] ? D.teams[0].id : 0;
  }

  const r = await post(payload);
  if(!r.ok){ toast(r.error || 'No se ha podido guardar.', 'bad'); return; }

  if(D.activo.id){
    Object.assign(D.activo, datos);
    const item = D.ejercicios.find(x => x.id === D.activo.id);
    if(item) Object.assign(item, datos);
  } else {
    D.activo = r.ejercicio;
    D.ejercicios.push(r.ejercicio);
  }

  toast('Tarea guardada');
  pintarLista();
  pintarFicha();
}

async function borrarFicha(){
  if(!D.activo || !D.activo.id) return;
  if(DEMO){ toast('Sin servidor no se pueden borrar tareas: esta es la vista de diseño.'); return; }
  if(!confirm(`¿Borrar «${D.activo.name}»? Los bloques que ya la tengan enganchada conservan ` +
              'su nombre, pero deja de estar en la biblioteca.')) return;

  const r = await post({action:'borrar_ejercicio', exercise_id:D.activo.id});
  if(!r.ok){ toast(r.error || 'No se ha podido borrar.', 'bad'); return; }

  D.ejercicios = D.ejercicios.filter(x => x.id !== D.activo.id);
  D.activo = null;
  pintarLista();
  pintarFicha();
  toast('Tarea borrada');
}

/* ── dibujo de los elementos ────────────────────────────────── */
function pzDefsSVG(){
  return PZ_COLORES.map((c, i) =>
    `<marker id="pzFl${i}" markerWidth="6" markerHeight="6" refX="4.4" refY="3"
             orient="auto" markerUnits="strokeWidth">
       <path d="M0,0 L6,3 L0,6 Z" fill="${c}"/></marker>`).join('');
}
function pzMarcador(color){
  const i = PZ_COLORES.indexOf(color);
  return `url(#pzFl${i < 0 ? 0 : i})`;
}
function pzOnda(x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const n = Math.max(2, Math.round(len / 26)), amp = 7;
  let d = `M${x1.toFixed(1)},${y1.toFixed(1)}`;
  for(let i = 0; i < n; i++){
    const t1 = (i + 1) / n, tm = (i + 0.5) / n, s = i % 2 === 0 ? 1 : -1;
    const cx = x1 + dx * tm + nx * amp * s, cy = y1 + dy * tm + ny * amp * s;
    d += ` Q${cx.toFixed(1)},${cy.toFixed(1)} ${(x1 + dx * t1).toFixed(1)},${(y1 + dy * t1).toFixed(1)}`;
  }
  return d;
}

/* Trazo a mano alzada: curvas por los puntos medios, para que no
   se vea la escalera de puntos que deja el ratón. */
function pzSuave(pts){
  const P = pts.map(p => [p[0] / 100 * PZ_W, p[1] / 100 * PZ_H]);
  if(!P.length) return '';
  if(P.length < 3) return P.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  let d = `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for(let i = 1; i < P.length - 1; i++){
    const mx = (P[i][0] + P[i + 1][0]) / 2, my = (P[i][1] + P[i + 1][1]) / 2;
    d += ` Q${P[i][0].toFixed(1)},${P[i][1].toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
  }
  const u = P[P.length - 1];
  return d + ` L${u[0].toFixed(1)},${u[1].toFixed(1)}`;
}

function pzElementoSVG(el, i, sel){
  const cls  = 'pz-el' + (sel ? ' pz-sel' : '');
  const col  = el.color || '#161822';
  const gro  = el.w2 || 3.6;
  const dato = i >= 0 ? ` data-i="${i}"` : '';

  if(el.type === 'trazo'){
    return `<path class="${cls}"${dato} d="${pzSuave(el.pts || [])}" fill="none" stroke="${col}"
              stroke-width="${gro}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }

  if(PZ_CAJAS.includes(el.type)){
    const x = el.x / 100 * PZ_W, y = el.y / 100 * PZ_H;
    const w = el.w / 100 * PZ_W, h = el.h / 100 * PZ_H;
    const com = `class="${cls}"${dato} fill="${col}" fill-opacity="0.18" stroke="${col}"
                 stroke-width="${gro}" stroke-dasharray="7 5"`;
    return el.type === 'elipse'
      ? `<ellipse ${com} cx="${x + w / 2}" cy="${y + h / 2}" rx="${Math.max(w / 2, 1)}" ry="${Math.max(h / 2, 1)}"/>`
      : `<rect ${com} x="${x}" y="${y}" width="${Math.max(w, 1)}" height="${Math.max(h, 1)}" rx="4"/>`;
  }

  if(PZ_LINEAS.includes(el.type)){
    const x1 = el.x1 / 100 * PZ_W, y1 = el.y1 / 100 * PZ_H;
    const x2 = el.x2 / 100 * PZ_W, y2 = el.y2 / 100 * PZ_H;
    const flecha = el.type === 'linea' ? '' : ` marker-end="${pzMarcador(col)}"`;
    const dash   = el.type === 'flecha_pase' ? ' stroke-dasharray="9 6"' : '';
    if(el.type === 'flecha_cond'){
      return `<path class="${cls}"${dato} d="${pzOnda(x1, y1, x2, y2)}" fill="none"
                stroke="${col}" stroke-width="${gro}" stroke-linecap="round"${flecha}/>`;
    }
    return `<line class="${cls}"${dato} x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
              stroke="${col}" stroke-width="${gro}" stroke-linecap="round"${dash}${flecha}/>`;
  }

  const x = el.x / 100 * PZ_W, y = el.y / 100 * PZ_H;
  const rot = el.rot ? ` rotate(${(+el.rot).toFixed(2)})` : '';
  const gro2 = el.scale && el.scale !== 1 ? ` scale(${(+el.scale).toFixed(3)})` : '';
  const abre = `<g class="${cls}"${dato} transform="translate(${x.toFixed(1)},${y.toFixed(1)})${rot}${gro2}">`;

  if(el.type === 'cono'){
    return abre + `<ellipse cy="9" rx="11" ry="3.2" fill="#c96f2c"/>
      <polygon points="-8,9 8,9 0,-11" fill="#f08a3c" stroke="#8a4413" stroke-width="1.1"/>
      <path d="M-4,-1 4,-1" stroke="#fff" stroke-width="2" opacity=".65"/></g>`;
  }
  if(el.type === 'pica'){
    return abre + `<ellipse cy="2" rx="6" ry="2.2" fill="#00000033"/>
      <rect x="-2.3" y="-24" width="4.6" height="26" rx="2" fill="#f0d264" stroke="#9d7d1c" stroke-width=".9"/>
      <circle cy="-25" r="4.6" fill="#f0d264" stroke="#9d7d1c" stroke-width=".9"/></g>`;
  }
  if(el.type === 'balon'){
    return abre + `<ellipse cy="8.5" rx="8" ry="2.4" fill="#00000033"/>
      <circle r="8.6" fill="#ffffff" stroke="#20242e" stroke-width="1.4"/>
      <path d="M0,-5.4 5.1,-1.7 3.2,4.4 -3.2,4.4 -5.1,-1.7Z" fill="#20242e"/>
      <path d="M0,-8.6 0,-5.4M5.1,-1.7 8.3,-2.8M3.2,4.4 5.3,7.1M-3.2,4.4 -5.3,7.1M-5.1,-1.7 -8.3,-2.8"
            stroke="#20242e" stroke-width="1.2" stroke-linecap="round"/></g>`;
  }

  if(el.type === 'porteria'){
    return abre + `<rect x="-17" y="-10" width="34" height="20" fill="#ffffff" fill-opacity=".18"
        stroke="#2a2f3d" stroke-opacity=".55" stroke-width="6" stroke-linejoin="round"/>
      <rect x="-17" y="-10" width="34" height="20" fill="none"
        stroke="#f7f9ff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-17,-10 -17,10 M17,-10 17,10 M-8.5,-10 -8.5,10 M8.5,-10 8.5,10 M-17,0 17,0"
        stroke="#8a93a8" stroke-width="1" opacity=".85"/></g>`;
  }
  if(el.type === 'escalera'){
    return abre + `<rect x="-11" y="-27" width="22" height="54" fill="#ffffff" fill-opacity=".16"
        stroke="#2a2f3d" stroke-opacity=".5" stroke-width="5"/>
      <rect x="-11" y="-27" width="22" height="54" fill="none" stroke="#f7f9ff" stroke-width="2.2"/>
      <path d="M-11,-13.5 11,-13.5 M-11,0 11,0 M-11,13.5 11,13.5"
        stroke="#2a2f3d" stroke-opacity=".45" stroke-width="4.4"/>
      <path d="M-11,-13.5 11,-13.5 M-11,0 11,0 M-11,13.5 11,13.5" stroke="#f7f9ff" stroke-width="2.2"/></g>`;
  }

  if(el.type === 'jugador'){
    const c = PZ_COLOR_EQUIPO[el.equipo] || PZ_COLOR_EQUIPO.a;
    const oscuro = el.equipo === 'portero';
    return abre + `<circle r="13.5" fill="#00000030"/>
      <circle r="13" fill="${c}" stroke="#ffffff" stroke-width="2.2"/>
      <text text-anchor="middle" dominant-baseline="central" y="0.5" font-size="12.5"
            fill="${oscuro ? '#3a2a05' : '#ffffff'}" font-family="Inter,system-ui,sans-serif"
            font-weight="700" style="pointer-events:none">${esc(el.num ?? '')}</text></g>`;
  }
  if(el.type === 'texto'){
    return abre + `<text font-size="17" fill="${col}" font-family="Inter,system-ui,sans-serif"
        font-weight="700" dominant-baseline="middle"
        style="paint-order:stroke;stroke:#ffffff;stroke-width:4.5px;stroke-linejoin:round"
        >${esc(el.text || '')}</text></g>`;
  }
  return '';
}

function pzElementosSVG(elementos){
  return (elementos || []).map((el, i) => pzElementoSVG(el, i, false)).join('');
}

/* ── lectura y escritura del diagrama guardado ──────────────── */
function pzLeer(json){
  let d = null;
  try { d = JSON.parse(json); } catch(e){}
  if(Array.isArray(d))          return {field:'completo', els:d};
  if(d && Array.isArray(d.els)) return {field:d.field || 'completo', els:d.els};
  return {field:'completo', els:[]};
}
function pzEscribir(){
  return JSON.stringify({v:2, field:pzCampoTipo, els:pzElementos});
}

function pizarraPreviewSVG(diagramJSON){
  const d = pzLeer(diagramJSON);
  return `<svg viewBox="0 0 700 450"><defs>${pzDefsSVG()}</defs>${pzFondo(d.field)}${pzElementosSVG(d.els)}</svg>`;
}

/* ── historial ──────────────────────────────────────────────── */
function pzGuardarPaso(){
  pzHist = pzHist.slice(0, pzHistI + 1);
  pzHist.push(JSON.stringify(pzElementos));
  if(pzHist.length > 80) pzHist.shift();
  pzHistI = pzHist.length - 1;
  pzBotonesHist();
}
function pzBotonesHist(){
  const a = $('pzDeshacer'), b = $('pzRehacer');
  if(a) a.disabled = pzHistI <= 0;
  if(b) b.disabled = pzHistI >= pzHist.length - 1;
}
function pzAndar(paso){
  const i = pzHistI + paso;
  if(i < 0 || i >= pzHist.length) return;
  pzHistI = i;
  pzElementos = JSON.parse(pzHist[i]);
  pzSeleccion = null;
  pzRender();
  pzBotonesHist();
}

/* ── selección ──────────────────────────────────────────────── */
const PZ_ETIQUETAS = {cono:'Cono', pica:'Pica', jugador:'Jugador', balon:'Balón',
  porteria:'Portería', escalera:'Escalera', linea:'Línea', flecha_mov:'Desplazamiento',
  flecha_pase:'Pase', flecha_cond:'Conducción', zona:'Zona', elipse:'Zona ovalada',
  texto:'Texto', trazo:'Dibujo a mano'};

function pzRenderSeleccion(){
  const panel = $('pzSelPanel');
  const el = pzSeleccion !== null ? pzElementos[pzSeleccion] : null;

  if(!el){ panel.hidden = true; return; }
  panel.hidden = false;

  $('pzSelLabel').textContent = PZ_ETIQUETAS[el.type] || el.type;
  $('pzSelJugador').hidden = el.type !== 'jugador';
  $('pzSelTexto').hidden   = el.type !== 'texto';
  $('pzSelColor').hidden   = el.type === 'jugador' || el.type === 'balon' ||
                             el.type === 'cono' || el.type === 'pica' ||
                             el.type === 'porteria' || el.type === 'escalera';

  if(el.type === 'jugador'){
    if(document.activeElement !== $('pzSelNum')) $('pzSelNum').value = el.num ?? '';
    $('pzSelEquipo').value = el.equipo || 'a';
  }
  if(el.type === 'texto' && document.activeElement !== $('pzSelTexto')){
    $('pzSelTexto').value = el.text || '';
  }
  document.querySelectorAll('#pzSelColor .pz-color').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.selcolor === (el.color || '#161822'))));
}

function pzTiradores(){
  const el = pzSeleccion !== null ? pzElementos[pzSeleccion] : null;
  if(!el) return '';
  const p = (x, y, id) => `<circle class="pz-handle" data-handle="${id}"
    cx="${(x / 100 * PZ_W).toFixed(1)}" cy="${(y / 100 * PZ_H).toFixed(1)}" r="7"/>`;
  if(PZ_LINEAS.includes(el.type)) return p(el.x1, el.y1, 'a') + p(el.x2, el.y2, 'b');
  if(PZ_CAJAS.includes(el.type))  return p(el.x, el.y, 'tl') + p(el.x + el.w, el.y + el.h, 'br');
  if(PZ_ICONOS.includes(el.type)) return pzTiradoresIcono(el);
  return '';
}

/* tiradores de rotar/redimensionar para iconos: se apoyan en la caja
   local del propio dibujo (getBBox, que no incluye su transform) para
   colocar el asa de la esquina y el asa de rotación por encima. */
function pzBBoxLocal(){
  const nodo = document.querySelector(`#pzElems [data-i="${pzSeleccion}"]`);
  if(!nodo) return null;
  try { return nodo.getBBox(); } catch(err){ return null; }
}
function pzTiradoresIcono(el){
  const bbox = pzBBoxLocal();
  if(!bbox) return '';
  const tx = el.x / 100 * PZ_W, ty = el.y / 100 * PZ_H;
  const rot = (el.rot || 0) * Math.PI / 180, esc = el.scale || 1;
  const punto = (lx, ly) => {
    const sx = lx * esc, sy = ly * esc;
    return {x: tx + sx * Math.cos(rot) - sy * Math.sin(rot),
            y: ty + sx * Math.sin(rot) + sy * Math.cos(rot)};
  };
  const midX = bbox.x + bbox.width / 2;
  const borde = punto(midX, bbox.y);
  const cima  = punto(midX, bbox.y - 18);
  const esq   = punto(bbox.x + bbox.width, bbox.y + bbox.height);
  return `<line class="pz-handle-tallo" x1="${borde.x.toFixed(1)}" y1="${borde.y.toFixed(1)}"
            x2="${cima.x.toFixed(1)}" y2="${cima.y.toFixed(1)}"/>
    <circle class="pz-handle" data-handle="rot" cx="${cima.x.toFixed(1)}" cy="${cima.y.toFixed(1)}" r="7"/>
    <circle class="pz-handle" data-handle="esc" cx="${esq.x.toFixed(1)}" cy="${esq.y.toFixed(1)}" r="7"/>`;
}

function pzRenderFondo(){
  $('pzFondo').innerHTML = pzFondo(pzCampoTipo);
}

function pzRender(){
  $('pzElems').innerHTML = pzElementos.map((el, i) => pzElementoSVG(el, i, i === pzSeleccion)).join('');
  $('pzTiradores').innerHTML = pzTiradores();
  pzRenderSeleccion();
  pzActualizarFlotante();
}

/* menú flotante (duplicar/eliminar) sobre el objeto seleccionado */
function pzActualizarFlotante(){
  const flot = $('pzFlotante');
  if(!flot) return;
  if(pzSeleccion === null || pzArrastre){ flot.hidden = true; return; }
  const nodo = document.querySelector(`#pzElems [data-i="${pzSeleccion}"]`);
  const cont = $('pzLienzo');
  if(!nodo || !cont){ flot.hidden = true; return; }
  const nb = nodo.getBoundingClientRect();
  const cb = cont.getBoundingClientRect();
  if(!nb.width && !nb.height){ flot.hidden = true; return; }
  const arriba = (nb.top - cb.top) > 50;
  flot.style.left = (nb.left + nb.width / 2 - cb.left) + 'px';
  flot.style.top  = (arriba ? nb.top - cb.top - 10 : nb.bottom - cb.top + 10) + 'px';
  flot.classList.toggle('pz-flot-abajo', !arriba);
  flot.hidden = false;
}

/* Punto del click/touch en % del viewBox, pase lo que pase con el
   tamaño real del SVG en pantalla. */
function pzPunto(evt){
  const svg = $('pzCampo');
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return {x: Math.max(0, Math.min(100, p.x / PZ_W * 100)),
          y: Math.max(0, Math.min(100, p.y / PZ_H * 100))};
}

function pzMover(el, dx, dy){
  if(el.type === 'trazo'){ el.pts = el.pts.map(([a, b]) => [a + dx, b + dy]); return; }
  if(PZ_LINEAS.includes(el.type)){ el.x1 += dx; el.y1 += dy; el.x2 += dx; el.y2 += dy; return; }
  el.x += dx; el.y += dy;
}

function pzSiguienteNumero(equipo){
  const usados = pzElementos.filter(e => e.type === 'jugador' && e.equipo === equipo).map(e => +e.num || 0);
  return (usados.length ? Math.max(...usados) : 0) + 1;
}

/* ── abrir, guardar, quitar ─────────────────────────────────── */
function pzAbrir(){
  if(!D.activo || !D.activo.id){ toast('Guarda la tarea antes de abrir la pizarra.', 'bad'); return; }

  const d = pzLeer(D.activo.diagram);
  pzElementos   = d.els;
  pzCampoTipo   = d.field;
  pzHerramienta = 'mover';
  pzEquipo = 'a';
  pzColor  = PZ_COLORES[0];
  pzGrosor = PZ_GROSORES[1];
  pzSeleccion = null; pzArrastre = null; pzTrazo = null;
  pzHist = []; pzHistI = -1;
  pzGuardarPaso();

  $('dlgPizarraSub').textContent = D.activo.name || 'Tarea';
  pzMarcar();
  pzRenderFondo();
  pzRender();
  $('dlgPizarra').classList.add('open');
}

async function pzGuardar(){
  if(!D.activo || !D.activo.id) return;
  if(DEMO){ toast('Sin servidor no se puede guardar la pizarra: esta es la vista de diseño.'); return; }
  const btn = $('btnGuardarPizarra');
  btn.disabled = true;

  const datos = leerFicha();
  const diagramJSON = pzEscribir();
  const r = await post({action:'editar_ejercicio', exercise_id:D.activo.id, ...datos, diagram:diagramJSON});
  btn.disabled = false;

  if(!r.ok){ toast(r.error || 'No se ha podido guardar el dibujo.', 'bad'); return; }

  Object.assign(D.activo, datos, {diagram: diagramJSON});
  const item = D.ejercicios.find(x => x.id === D.activo.id);
  if(item) Object.assign(item, datos, {diagram: diagramJSON});

  $('dlgPizarra').classList.remove('open');
  pintarLista();
  pintarFicha();
  toast('Pizarra guardada');
}

async function pzQuitar(){
  if(!D.activo || !D.activo.id) return;
  if(DEMO){ toast('Sin servidor no se puede quitar la pizarra: esta es la vista de diseño.'); return; }
  if(!confirm('¿Quitar el dibujo de la pizarra de esta tarea?')) return;

  const datos = leerFicha();
  const r = await post({action:'editar_ejercicio', exercise_id:D.activo.id, ...datos, diagram:''});
  if(!r.ok){ toast(r.error || 'No se ha podido quitar.', 'bad'); return; }

  Object.assign(D.activo, datos, {diagram:null});
  const item = D.ejercicios.find(x => x.id === D.activo.id);
  if(item) Object.assign(item, datos, {diagram:null});
  pintarLista();
  pintarFicha();
  toast('Pizarra quitada');
}

/* ── exportar a PNG ─────────────────────────────────────────── */
function pzExportarPNG(){
  const esc2 = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'pizarra';

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 700 450">`
    + `<defs>${pzDefsSVG()}</defs>${pzFondo(pzCampoTipo)}${pzElementosSVG(pzElementos)}</svg>`;

  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = 1400; c.height = 900;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, 1400, 900);
    c.toBlob(blob => {
      if(!blob){ toast('No se ha podido generar la imagen.', 'bad'); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = esc2((D.activo && D.activo.name) || 'pizarra') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('Imagen descargada');
    }, 'image/png');
  };
  img.onerror = () => toast('No se ha podido generar la imagen.', 'bad');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ── ratón y dedo sobre el campo ────────────────────────────── */
$('pzCampo').addEventListener('pointerdown', e => {
  const p = pzPunto(e);
  const svg = $('pzCampo');
  try { svg.setPointerCapture(e.pointerId); } catch(err){}

  if(pzHerramienta === 'goma'){
    const g = e.target.closest('.pz-el');
    if(g){ pzElementos.splice(+g.dataset.i, 1); pzSeleccion = null; pzRender(); pzGuardarPaso(); }
    return;
  }

  if(pzHerramienta === 'mover'){
    const h = e.target.closest('[data-handle]');
    if(h && pzSeleccion !== null){
      const cual = h.dataset.handle;
      if(cual === 'rot' || cual === 'esc'){
        const el = pzElementos[pzSeleccion];
        const bbox = pzBBoxLocal();
        if(!bbox) return;
        pzArrastre = {modo:cual, i:pzSeleccion, bbox,
          tx: el.x / 100 * PZ_W, ty: el.y / 100 * PZ_H, movido:false};
        return;
      }
      pzArrastre = {modo:'tirador', i:pzSeleccion, cual, prev:p, movido:false};
      return;
    }
    const g = e.target.closest('.pz-el');
    if(!g){ pzSeleccion = null; pzRender(); return; }
    pzSeleccion = +g.dataset.i;
    pzArrastre  = {modo:'mover', i:pzSeleccion, prev:p, movido:false};
    pzRender();
    return;
  }

  if(PZ_PUNTOS.includes(pzHerramienta)){
    const el = {type: pzHerramienta, x:p.x, y:p.y};
    if(pzHerramienta === 'jugador'){ el.equipo = pzEquipo; el.num = pzSiguienteNumero(pzEquipo); }
    pzElementos.push(el);
    pzSeleccion = pzElementos.length - 1;
    pzRender(); pzGuardarPaso();
    return;
  }

  if(pzHerramienta === 'texto'){
    pzElementos.push({type:'texto', x:p.x, y:p.y, text:'Texto', color:pzColor});
    pzSeleccion = pzElementos.length - 1;
    pzRender(); pzGuardarPaso();
    const inp = $('pzSelTexto');
    inp.value = 'Texto';
    inp.focus(); inp.select();
    return;
  }

  if(pzHerramienta === 'lapiz'){
    pzTrazo = {type:'trazo', pts:[[p.x, p.y]], color:pzColor, w2:pzGrosor};
    return;
  }

  pzTrazo = {type:pzHerramienta, x1:p.x, y1:p.y, x2:p.x, y2:p.y, color:pzColor, w2:pzGrosor};
});

$('pzCampo').addEventListener('pointermove', e => {
  if(pzArrastre){
    const p = pzPunto(e);
    const el = pzElementos[pzArrastre.i];
    if(!el) return;

    if(pzArrastre.modo === 'rot' || pzArrastre.modo === 'esc'){
      const px = p.x / 100 * PZ_W, py = p.y / 100 * PZ_H;
      const dxA = px - pzArrastre.tx, dyA = py - pzArrastre.ty;
      if(Math.hypot(dxA, dyA) > 0.4) pzArrastre.movido = true;

      if(pzArrastre.modo === 'rot'){
        const angulo = Math.atan2(dyA, dxA) * 180 / Math.PI;
        const midX = pzArrastre.bbox.x + pzArrastre.bbox.width / 2, midY = pzArrastre.bbox.y - 18;
        const anguloBase = Math.atan2(midY, midX) * 180 / Math.PI;
        el.rot = angulo - anguloBase;
      } else {
        const rot0 = -(el.rot || 0) * Math.PI / 180;
        const ux = dxA * Math.cos(rot0) - dyA * Math.sin(rot0);
        const uy = dxA * Math.sin(rot0) + dyA * Math.cos(rot0);
        const base = Math.hypot(pzArrastre.bbox.x + pzArrastre.bbox.width,
                                 pzArrastre.bbox.y + pzArrastre.bbox.height) || 1;
        el.scale = Math.max(0.35, Math.min(3.5, Math.hypot(ux, uy) / base));
      }
      pzRender();
      return;
    }

    const dx = p.x - pzArrastre.prev.x, dy = p.y - pzArrastre.prev.y;
    if(Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) pzArrastre.movido = true;

    if(pzArrastre.modo === 'mover'){
      pzMover(el, dx, dy);
    } else if(PZ_LINEAS.includes(el.type)){
      if(pzArrastre.cual === 'a'){ el.x1 = p.x; el.y1 = p.y; } else { el.x2 = p.x; el.y2 = p.y; }
    } else if(PZ_CAJAS.includes(el.type)){
      if(pzArrastre.cual === 'tl'){
        el.w += el.x - p.x; el.h += el.y - p.y; el.x = p.x; el.y = p.y;
      } else {
        el.w = p.x - el.x; el.h = p.y - el.y;
      }
      el.w = Math.max(1, el.w); el.h = Math.max(1, el.h);
    }
    pzArrastre.prev = p;
    pzRender();
    return;
  }

  if(!pzTrazo) return;
  const p = pzPunto(e);

  if(pzTrazo.type === 'trazo'){
    const ult = pzTrazo.pts[pzTrazo.pts.length - 1];
    if(Math.hypot(p.x - ult[0], p.y - ult[1]) > 0.4) pzTrazo.pts.push([p.x, p.y]);
  } else {
    pzTrazo.x2 = p.x; pzTrazo.y2 = p.y;
  }

  const previo = PZ_CAJAS.includes(pzTrazo.type)
    ? {...pzTrazo, x:Math.min(pzTrazo.x1, pzTrazo.x2), y:Math.min(pzTrazo.y1, pzTrazo.y2),
       w:Math.abs(pzTrazo.x2 - pzTrazo.x1), h:Math.abs(pzTrazo.y2 - pzTrazo.y1)}
    : pzTrazo;
  $('pzElems').innerHTML = pzElementos.map((el, i) => pzElementoSVG(el, i, i === pzSeleccion)).join('')
    + pzElementoSVG(previo, -1, false);
});

$('pzCampo').addEventListener('pointerup', e => {
  try { $('pzCampo').releasePointerCapture(e.pointerId); } catch(err){}

  if(pzArrastre){
    const movido = pzArrastre.movido;
    pzArrastre = null;
    if(movido) pzGuardarPaso();
    pzActualizarFlotante();
    return;
  }
  if(!pzTrazo) return;

  const t = pzTrazo; pzTrazo = null;

  if(t.type === 'trazo'){
    if(t.pts.length < 2){ pzRender(); return; }
    pzElementos.push(t);
  } else {
    if(Math.hypot(t.x2 - t.x1, t.y2 - t.y1) < 1.5){ pzRender(); return; }
    if(PZ_CAJAS.includes(t.type)){
      pzElementos.push({type:t.type, x:Math.min(t.x1, t.x2), y:Math.min(t.y1, t.y2),
        w:Math.abs(t.x2 - t.x1), h:Math.abs(t.y2 - t.y1), color:t.color, w2:t.w2});
    } else {
      pzElementos.push({type:t.type, x1:t.x1, y1:t.y1, x2:t.x2, y2:t.y2, color:t.color, w2:t.w2});
    }
  }
  pzSeleccion = pzElementos.length - 1;
  pzRender(); pzGuardarPaso();
});

/* ── teclado ────────────────────────────────────────────────── */
const PZ_TECLAS = {};
PZ_HERRAMIENTAS.forEach(h => { if(!h.sep) PZ_TECLAS[h.tecla.toLowerCase()] = h.id; });

document.addEventListener('keydown', e => {
  if(!$('dlgPizarra').classList.contains('open')) return;
  const escribiendo = document.activeElement &&
    ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);

  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
    e.preventDefault(); pzAndar(e.shiftKey ? 1 : -1); return;
  }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y'){
    e.preventDefault(); pzAndar(1); return;
  }
  if(escribiendo) return;

  if((e.key === 'Delete' || e.key === 'Backspace') && pzSeleccion !== null){
    e.preventDefault();
    pzBorrarSeleccion();
    return;
  }
  if(e.key === 'Escape' && pzSeleccion !== null){
    pzSeleccion = null; pzRender(); return;
  }
  const t = PZ_TECLAS[e.key.toLowerCase()];
  if(t && !e.ctrlKey && !e.metaKey && !e.altKey){
    pzHerramienta = t; pzMarcar();
  }
});

/* ── botones del editor ─────────────────────────────────────── */
document.addEventListener('click', e => {
  const tool = e.target.closest('.pz-tool');
  if(tool){ pzHerramienta = tool.dataset.tool; pzMarcar(); return; }

  const col = e.target.closest('#pzGrupoColor .pz-color');
  if(col){
    pzColor = col.dataset.color;
    if(pzSeleccion !== null && 'color' in (pzElementos[pzSeleccion] || {})){
      pzElementos[pzSeleccion].color = pzColor; pzRender(); pzGuardarPaso();
    }
    pzMarcar(); return;
  }

  const selCol = e.target.closest('#pzSelColor .pz-color');
  if(selCol && pzSeleccion !== null){
    pzElementos[pzSeleccion].color = selCol.dataset.selcolor;
    pzRender(); pzGuardarPaso(); return;
  }

  const gro = e.target.closest('.pz-grosor');
  if(gro){
    pzGrosor = +gro.dataset.grosor;
    if(pzSeleccion !== null && 'w2' in (pzElementos[pzSeleccion] || {})){
      pzElementos[pzSeleccion].w2 = pzGrosor; pzRender(); pzGuardarPaso();
    }
    pzMarcar(); return;
  }

  const campo = e.target.closest('.pz-campo-btn');
  if(campo){ pzCampoTipo = campo.dataset.campo; pzMarcar(); pzRenderFondo(); return; }

  const eq = e.target.closest('.pz-equipo');
  if(eq){ pzEquipo = eq.dataset.equipo; pzMarcar(); return; }

  if(e.target.closest('#pzDeshacer')){ pzAndar(-1); return; }
  if(e.target.closest('#pzRehacer')){ pzAndar(1); return; }
  if(e.target.closest('#pzExportar')){ pzExportarPNG(); return; }

  if(e.target.closest('#pzVaciar')){
    if(pzElementos.length && !confirm('¿Vaciar toda la pizarra?')) return;
    pzElementos = []; pzSeleccion = null;
    pzRender(); pzGuardarPaso();
    return;
  }

  if(e.target.closest('[data-flot-dup]')){ pzDuplicarSeleccion(); return; }
  if(e.target.closest('[data-flot-del]')){ pzBorrarSeleccion(); return; }
});

function pzDuplicarSeleccion(){
  if(pzSeleccion === null) return;
  const copia = JSON.parse(JSON.stringify(pzElementos[pzSeleccion]));
  pzMover(copia, 4, 4);
  if(copia.type === 'jugador') copia.num = pzSiguienteNumero(copia.equipo);
  pzElementos.push(copia);
  pzSeleccion = pzElementos.length - 1;
  pzRender(); pzGuardarPaso();
}
function pzBorrarSeleccion(){
  if(pzSeleccion === null) return;
  pzElementos.splice(pzSeleccion, 1);
  pzSeleccion = null;
  pzRender(); pzGuardarPaso();
}

/* Mientras se escribe el dibujo se actualiza en el acto, pero el
   paso de historial se apunta al parar: así deshacer no borra letra
   a letra. */
let pzTecleo = null;
function pzApuntarTarde(){
  clearTimeout(pzTecleo);
  pzTecleo = setTimeout(pzGuardarPaso, 600);
}

document.addEventListener('input', e => {
  if(pzSeleccion === null) return;
  if(e.target.id === 'pzSelNum'){ pzElementos[pzSeleccion].num = e.target.value; pzRender(); pzApuntarTarde(); }
  if(e.target.id === 'pzSelTexto'){ pzElementos[pzSeleccion].text = e.target.value; pzRender(); pzApuntarTarde(); }
});
document.addEventListener('change', e => {
  if(pzSeleccion === null) return;
  if(e.target.id === 'pzSelEquipo'){ pzElementos[pzSeleccion].equipo = e.target.value; pzRender(); pzGuardarPaso(); }
  if(e.target.id === 'pzSelNum' || e.target.id === 'pzSelTexto'){ clearTimeout(pzTecleo); pzGuardarPaso(); }
});

$('pzDefs').innerHTML = pzDefsSVG();
pzPintarPaleta();
pzMarcar();

/* ── carga ──────────────────────────────────────────────────── */
async function cargar(){
  pintarFiltros();
  pintarLista();

  if(DEMO){
    $('clubName').textContent = 'Tu cuenta';
    $('clubSub').textContent  = 'Vista sin servidor';
    $('meName').textContent   = 'Invitado';
    return;
  }

  const r = await get('action=estado').catch(() => null);
  if(!r){ window.plCuenta && plCuenta.mostrar(); return; }
  if(r.status === 401){ location.href = 'acceso.html'; return; }

  if(!r.ok || !r.user){ window.plCuenta && plCuenta.mostrar(); return; }

  if(window.plCuenta) plCuenta.marcar(r.user.type);
  if(r.user.type === 'club') return;

  D.user = r.user; D.club = r.club; D.teams = r.teams || [];

  if(window.plSyncPrefs) window.plSyncPrefs(r.user.theme, r.user.locale);

  const jugadores = D.teams.reduce((a,t) => a + t.players, 0);

  $('clubName').textContent  = r.club ? r.club.name : (r.user.name || 'Mi cuenta');
  $('clubSub').textContent   = r.club ? `Club · ${D.teams.length} ${D.teams.length===1?'equipo':'equipos'}`
                                      : 'Cuenta profesional';
  $('clubBadge').innerHTML = (r.club && r.club.badge_url)
    ? `<img src="${esc(r.club.badge_url)}?v=${Date.now()}" alt="Escudo de ${esc(r.club.name)}">`
    : esc(ini(r.club ? r.club.name : r.user.name));
  $('meName').textContent    = r.user.name || r.user.email;
  $('meRole').textContent    = r.user.role || 'Profesional';
  if($('meAvatar'))     $('meAvatar').textContent     = ini(r.user.name || r.user.email);
  if($('navPlantilla')) $('navPlantilla').textContent = jugadores;

  await cargarEjercicios();
}

/* ── interacción ────────────────────────────────────────────── */
$('buscar').addEventListener('input', e => { busca = e.target.value.trim().toLowerCase(); pintarLista(); });

document.addEventListener('click', async e => {

  if(e.target.closest('[data-cerrar-dlg]') || e.target.classList.contains('dialog-backdrop')){
    document.querySelectorAll('.dialog-backdrop').forEach(d => d.classList.remove('open'));
    return;
  }

  const filt = e.target.closest('[data-filtro-tipo]');
  if(filt){ filtroTipo = filt.dataset.filtroTipo; pintarFiltros(); pintarLista(); return; }

  const abre = e.target.closest('[data-abrir]');
  if(abre){ abrirFicha(+abre.dataset.abrir); return; }

  if(e.target.closest('[data-nueva-tarea]')){
    if(DEMO){ toast('Sin servidor no se pueden crear tareas: esta es la vista de diseño.'); return; }
    nuevaFicha();
    return;
  }

  if(e.target.closest('[data-guardar-tarea]')){ await guardarFicha(); return; }
  if(e.target.closest('[data-borrar-tarea]')){ await borrarFicha(); return; }
  if(e.target.closest('[data-abrir-pizarra]')){ pzAbrir(); return; }
  if(e.target.closest('[data-quitar-pizarra]')){ await pzQuitar(); return; }
  if(e.target.closest('#btnGuardarPizarra')){ await pzGuardar(); return; }

});

document.addEventListener('pl-prefs', () => { pintarLista(); if(D.activo) pintarFicha(); });

cargar();
</script>


<script>
/* ═══════════════════════════════════════════════════════════════
   Menú de la cuenta · se abre al pulsar el bloque de abajo a la
   izquierda de la barra lateral. Idioma, tema, cuenta y salida.
   ═══════════════════════════════════════════════════════════════ */
(function(){
  const TEMAS = [
    ['sistema','Sistema','<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.6" y="2.6" width="12.8" height="9" rx="1.6"/><path d="M5.6 13.4h4.8" stroke-linecap="round"/></svg>'],
    ['claro','Claro','<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.4v1.6M8 13v1.6M1.4 8h1.6M13 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"/></svg>'],
    ['oscuro','Oscuro','<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M13.4 9.6A5.8 5.8 0 0 1 6.4 2.6a5.8 5.8 0 1 0 7 7z"/></svg>']
  ];
  const IDIOMAS = [['es','ES'],['ca','CA'],['en','EN']];

  let cuentas = [];

  /* localStorage no siempre está: en modo privado, con cookies
     bloqueadas o dentro de un iframe lanza excepción. Sin esta red, un
     fallo de almacenamiento tumbaría el menú entero. */
  const mem = {};
  const guarda = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){ mem[k] = v; } };
  const lee    = k => { try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } };

  function tema(){ return lee('pl-theme') || 'sistema'; }
  function aplicarTema(t){
    if(t === 'sistema') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    guarda('pl-theme', t);
  }

  /* Sincronización con la cuenta. Manda lo que hay guardado en el
     servidor: es lo que hace que la preferencia te siga de un
     dispositivo a otro. Cada pantalla la llama al cargar su estado. */
  window.plSyncPrefs = function(theme, locale){
    if(theme && theme !== tema()) aplicarTema(theme);
    if(locale) guarda('pl-locale', locale);
    document.dispatchEvent(new CustomEvent('pl-prefs'));
  };

  const me = document.querySelector('.me');
  if(!me) return;

  me.setAttribute('role','button');
  me.setAttribute('aria-haspopup','menu');
  me.setAttribute('aria-expanded','false');
  me.tabIndex = 0;

  const pop = document.createElement('div');
  pop.className = 'umenu';
  pop.hidden = true;
  document.body.appendChild(pop);

  if(window.plCuentas){
    window.plCuentas.cargar().then(list => { cuentas = list; if(!pop.hidden) pintar(); });
    window.plCuentas.conectar(pop);
  }

  function pintar(){
    const nombre = document.getElementById('meName')?.textContent || 'Tu cuenta';
    const rol    = document.getElementById('meRole')?.textContent || '';
    const t      = tema();
    const idioma = lee('pl-locale') || 'es';

    pop.innerHTML = `
      <div class="umenu-yo">
        <div class="umenu-n">${nombre}</div>
        <div class="umenu-s">${rol}</div>
      </div>

      ${window.plCuentas ? window.plCuentas.bloqueHTML(cuentas) : ''}

      <a class="umenu-it" href="perfil.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="5.4" r="2.6"/><path d="M2.9 13.6c0-2.6 2.3-4.2 5.1-4.2s5.1 1.6 5.1 4.2"/></svg>
        Tu perfil</a>
      <a class="umenu-it" href="perfil.html#suscripcion">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.8" y="3.4" width="12.4" height="9.2" rx="1.8"/><path d="M1.8 6.6h12.4" stroke-linecap="round"/></svg>
        Suscripción</a>
      <a class="umenu-it" href="perfil.html#datos">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10.4V2.6M5.3 5.3 8 2.6l2.7 2.7"/><path d="M2.6 9.8v3.6h10.8V9.8"/></svg>
        Tus datos</a>

      <div class="umenu-sep"></div>

      <div class="umenu-tit">Tema</div>
      <div class="umenu-ops" data-ops="theme">
        ${TEMAS.map(([k,v,ico]) => `<button class="umenu-op" data-v="${k}"
          aria-pressed="${t===k}" title="${v}">${ico}<span>${v}</span></button>`).join('')}
      </div>

      <div class="umenu-tit">Idioma</div>
      <div class="umenu-ops" data-ops="locale">
        ${IDIOMAS.map(([k,v]) => `<button class="umenu-op" data-v="${k}"
          aria-pressed="${idioma===k}">${v}</button>`).join('')}
      </div>

      <div class="umenu-sep"></div>

      <button class="umenu-it umenu-salir" data-salir>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 13.6H3.4V2.4h2.8"/><path d="M10.2 11 13.2 8l-3-3M13.2 8H6.6"/></svg>
        Cerrar sesión</button>`;
  }

  function abrir(){
    pintar();
    pop.hidden = false;
    const r = me.getBoundingClientRect();
    /* con la barra plegada el menú se sale por la izquierda: se ancla
       al borde derecho de la barra, nunca fuera de la ventana */
    pop.style.left = Math.max(8, r.left) + 'px';
    pop.style.bottom = (window.innerHeight - r.top + 8) + 'px';
    me.setAttribute('aria-expanded','true');
  }
  function cerrar(){
    pop.hidden = true;
    me.setAttribute('aria-expanded','false');
  }

  me.addEventListener('click', e => { e.stopPropagation(); pop.hidden ? abrir() : cerrar(); });
  me.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pop.hidden ? abrir() : cerrar(); }
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrar(); });
  document.addEventListener('click', e => { if(!pop.contains(e.target)) cerrar(); });

  pop.addEventListener('click', async e => {
    e.stopPropagation();

    const op = e.target.closest('.umenu-op');
    if(op){
      const grupo = op.closest('.umenu-ops').dataset.ops;
      const valor = op.dataset.v;
      [...op.parentNode.children].forEach(b => b.setAttribute('aria-pressed', String(b === op)));

      if(grupo === 'theme')  aplicarTema(valor);
      if(grupo === 'locale'){ guarda('pl-locale', valor);
        document.dispatchEvent(new CustomEvent('pl-prefs')); }

      if(!/^https?:$/.test(location.protocol)) return;
      fetch('api/app.php', {method:'POST', headers:{'Content-Type':'application/json'},
        credentials:'same-origin',
        body:JSON.stringify({action:'preferencias',
          locale: lee('pl-locale') || 'es',
          theme:  tema()})}).catch(() => {});
      return;
    }

    if(e.target.closest('[data-salir]')){
      if(window.plCuenta) plCuenta.olvidar();

      if(!/^https?:$/.test(location.protocol)){
        location.href = 'acceso.html';
        return;
      }

      const activa = cuentas.find(c => c.active);
      if(window.plCuentas && activa){
        /* Si quedan otras cuentas enlazadas, cerrar sesión solo cierra
           la activa y sigue en las demás; si no, cierra del todo. */
        await window.plCuentas.cerrarSesion(activa.id);
        return;
      }

      await fetch('api/logout.php', {method:'POST', credentials:'same-origin'}).catch(() => {});
      location.href = 'acceso.html';
    }
  });
})();
</script>
</body>
</html>
